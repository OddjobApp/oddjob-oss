name: Feature request
description: Something Oddjob should do that it does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to get done, and where Oddjob gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The change you have in mind. Alternatives you considered are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Cycles, studios or integrations it touches, and links to related issues.

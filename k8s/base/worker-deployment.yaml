# Oddjob Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oddjob-worker
  namespace: oddjob
  labels:
    app.kubernetes.io/name: oddjob
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oddjob
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oddjob
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: oddjob
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker-entrypoint.js"]
          env:
            - name: SERVICE_ROLE
              value: "worker"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: REDIS_URL
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: QDRANT_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SESSION_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: ENCRYPTION_KEY
            - name: INTERNAL_RPC_KEY
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: INTERNAL_RPC_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      restartPolicy: Always

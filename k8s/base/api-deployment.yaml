# Oddjob API Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oddjob-api
  namespace: oddjob
  labels:
    app.kubernetes.io/name: oddjob
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oddjob
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oddjob
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: oddjob
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: SERVICE_ROLE
              value: "api"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: NODE_ENV
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: REDIS_URL
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: QDRANT_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SESSION_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: ENCRYPTION_KEY
            - name: INTERNAL_RPC_KEY
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: INTERNAL_RPC_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: JWT_SECRET
            - name: SMTP_SERVER
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SMTP_SERVER
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SMTP_USERNAME
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: FROM_EMAIL
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
      restartPolicy: Always

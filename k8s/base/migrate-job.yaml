# One-off migration job for Oddjob.
# Apply before rolling out a new API/Worker deployment:
#   kubectl apply -f k8s/base/migrate-job.yaml -n oddjob
# CI uses scripts/run-k8s-migrations.sh for a release-specific Job with the
# namespace's oddjob-secrets/DATABASE_URL and waits before updating the app.
apiVersion: batch/v1
kind: Job
metadata:
  name: oddjob-migrate
  namespace: oddjob
  labels:
    app.kubernetes.io/name: oddjob
    app.kubernetes.io/component: migrate
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oddjob
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: oddjob
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.js"]
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: REDIS_URL
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: QDRANT_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SESSION_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: ENCRYPTION_KEY

# Oddjob Secrets Template
# IMPORTANT: Replace placeholder values before applying!
# Consider using sealed-secrets, external-secrets, or vault in production
apiVersion: v1
kind: Secret
metadata:
  name: oddjob-secrets
  namespace: oddjob
  labels:
    app.kubernetes.io/name: oddjob
type: Opaque
stringData:
  # Database connection string
  # Replace with your managed PostgreSQL connection string
  DATABASE_URL: "postgresql://user:password@postgres-host:5432/oddjob"
  
  # Session secret (generate with: openssl rand -hex 32)
  SESSION_SECRET: "REPLACE_WITH_SECURE_SECRET"
  
  # OpenAI API Key (if using AI features)
  OPENAI_API_KEY: "sk-REPLACE_WITH_YOUR_KEY"
  
  # Qdrant API Key (if using authentication)
  QDRANT_API_KEY: ""
  
  # MCP Secret for token signing
  MCP_SECRET: "REPLACE_WITH_SECURE_SECRET"

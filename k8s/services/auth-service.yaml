# Auth Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: oddjob
  labels:
    app.kubernetes.io/name: oddjob
    app.kubernetes.io/component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oddjob
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oddjob
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: auth
          image: oddjob-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: AUTH_SERVICE_PORT
              value: "5001"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: oddjob-config
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: oddjob-secrets
                  key: SESSION_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 30
---
# Auth Service
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: oddjob
  labels:
    app.kubernetes.io/name: oddjob
    app.kubernetes.io/component: auth
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: oddjob
    app.kubernetes.io/component: auth

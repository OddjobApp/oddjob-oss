name: "Oddjob Enterprise Hybrid AI SDLC"
version: "1.1"
containers: {}
description: "A highly-structured 30-day Software Development Life Cycle utilizing 9 Specialized AI Agents, 6 Orchestrated Missions, strict Value Stream Management (VSM) telemetry, and 5 comprehensive workbenches for end-to-end SDLC management."
author: "Oddjob Marketplace"

# UI Metadata for Cycle Management Interface
ui_metadata:
  display_name: "Enterprise Hybrid AI SDLC"
  icon: "🔄"
  theme_color: "#3b82f6"
  display_priority: 1
  category: "development"
  show_in_gallery: true
  featured: true

guardrails:
  execution_sandbox: true
  max_thrashing_iterations: 3
  enforce_read_only_prod: true
  token_budget_per_ticket: 500000 # Cost Control

ai_provider:
  provider: "anthropic" # Options: "anthropic", "openai", "google"
  api_key: "${ENV.AI_API_KEY}"
  default_model: "claude-3.5-sonnet"
  fallback_model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 4096
  timeout_ms: 120000

tech_stack:
  backend_language: "${ENV.TECH_BACKEND_LANG}" # e.g. TypeScript, Python, Go
  frontend_framework: "${ENV.TECH_FRONTEND_FRAMEWORK}" # e.g. React, Vue, Angular
  mobile_framework: "${ENV.TECH_MOBILE_FRAMEWORK}" # e.g. React Native, Swift, Kotlin

portfolio_classification:
  group_type: "project" # Options: "project" (New Features/End-Dated), "operations" (Maintenance/Continuous)
  capitalization_category: "CapEx" # "CapEx" for Projects, "OpEx" for Operations
  cost_center: "${ENV.ENTERPRISE_COST_CENTER}"

organizational_guidelines:
  constitution:
    required: false # Startups may not have a formalized AI constitution
    path: "file://knowledge/guidelines/ai_constitution.md"
  coding_standards:
    required: true # Mandatory for predictable agent output
    path: "file://knowledge/guidelines/coding_standards.md"
  security_standards:
    required: false
    path: "file://knowledge/guidelines/security_standards.md"
  compliance:
    enabled: true
    frameworks: ["SOC2", "GDPR", "OWASP"]

integrations:
  source_control:
    required: true
    provider: "${ENV.GIT_PROVIDER}" # github | gitlab | bitbucket
    repo_url: "${ENV.GIT_REPO_URL}"
    api_token: "${ENV.GIT_API_TOKEN}"
  database:
    required: true
    dialect: "${ENV.DB_DIALECT}" # postgres | mysql | sqlite
    dev_url: "${ENV.DEV_DATABASE_URL}"
    staging_url: "${ENV.STAGING_DATABASE_URL}"
    redis_url: "${ENV.REDIS_URL}" # Optional for caching
    mongodb_url: "${ENV.MONGODB_URL}" # Optional for document storage
    vector_url: "${ENV.VECTOR_DB_URL}" # Optional for dedicated RAG (Pinecone/Weaviate)
  package_registry:
    enabled: false # Set to true for enterprise private registries (Artifactory/Nexus)
    npm_registry_url: "${ENV.NPM_REGISTRY_URL}"
    npm_auth_token: "${ENV.NPM_AUTH_TOKEN}"
  jira:
    required: true
    project_key: "${ENV.JIRA_PROJECT_KEY}"
    endpoint: "${ENV.JIRA_BASE_URL}"
    api_token: "${ENV.JIRA_API_TOKEN}"
  confluence:
    required: false
    engineering_space: "${ENV.CONFLUENCE_ENG_SPACE}"
    endpoint: "${ENV.CONFLUENCE_BASE_URL}"
    api_token: "${ENV.CONFLUENCE_API_TOKEN}"
  sharepoint:
    enabled: false # Set to true if replacing/augmenting Confluence
    tenant_id: "${ENV.SHAREPOINT_TENANT_ID}"
    site_id: "${ENV.SHAREPOINT_SITE_ID}"
    drive_id: "${ENV.SHAREPOINT_DRIVE_ID}"
  google_drive:
    enabled: false # Set to true if replacing/augmenting Confluence
    shared_drive_id: "${ENV.GOOGLE_SHARED_DRIVE_ID}"
    folder_id: "${ENV.GOOGLE_DOCS_FOLDER_ID}"
  google_calendar:
    enabled: false # For Scrum Master meeting generation
    calendar_id: "${ENV.GOOGLE_CALENDAR_ID}"
  gcp:
    enabled: false # Alternative to AWS for Release Manager
    project_id: "${ENV.GCP_PROJECT_ID}"
    region: "${ENV.GCP_REGION}"
  slack:
    required: true
    workspace_id: "${ENV.SLACK_WORKSPACE_ID}"
    alerts_channel: "${ENV.SLACK_ALERTS_CHANNEL}"
    approvals_channel: "${ENV.SLACK_APPROVALS_CHANNEL}"
  agentmail:
    enabled: true
    admin_address: "${ENV.AGENTMAIL_ADMIN_ADDRESS}"
    domain: "${ENV.AGENTMAIL_DOMAIN}"
  ngrok:
    enabled: true
    auth_token: "${ENV.NGROK_AUTH_TOKEN}"
    static_domain: "${ENV.NGROK_STATIC_DOMAIN}"
  msteams:
    enabled: false # Set to true if replacing Slack
    tenant_id: "${ENV.MSTEAMS_TENANT_ID}"
    team_id: "${ENV.MSTEAMS_TEAM_ID}"
    alerts_webhook_url: "${ENV.MSTEAMS_ALERTS_WEBHOOK}"
    approvals_webhook_url: "${ENV.MSTEAMS_APPROVALS_WEBHOOK}"

vsm_telemetry:
  enabled: true
  metrics: ["lead_time", "cycle_time", "mttr", "deployment_frequency"]
  jira_status_mapping:
    backlog: "Backlog"
    in_progress: "In Progress"
    in_review: "Code Review"
    qa: "In QA"
    uat: "UAT"
    done: "Done"

prediction_intelligence:
  defect_forecasting:
    enabled: true
    model: "oddjob-risk-analyzer-v1"
    threshold: 0.85 # Flag for human review if risk > 85%
  velocity_forecasting:
    enabled: true
    historical_window_days: 90

mcp_servers:
  stitch:
    enabled: true
    endpoint: "http://localhost:3001/mcp"
    tools: ["generate_screen_from_text", "apply_design_system"]
    timeout_ms: 30000
  filesystem:
    enabled: true
    endpoint: "http://localhost:3002/mcp"
    tools: ["read_file", "write_file", "list_directory"]
    allowed_paths: ["server/", "client/", "mobile/"]
  github:
    enabled: true
    endpoint: "http://localhost:3003/mcp"
    tools: ["create_pr", "get_file", "update_file"]

directories:
  knowledge_base: "knowledge/"
  document_templates: "knowledge/document-templates/"
  system_prompts: "knowledge/prompts/"
  backend: ["server/", "shared/schema/"]
  frontend: ["client/", "app/"]
  mobile: ["mobile/"]
  testing: ["tests/e2e/", "tests/integration/"]
  design_assets: "knowledge/assets/design/"

knowledge_graph:
  vector_db:
    provider: "qdrant" # Options: "qdrant", "pinecone", "weaviate"
    url: "${ENV.VECTOR_DB_URL}"
    api_key: "${ENV.VECTOR_DB_API_KEY}"
    collection_prefix: "sdlc-"
  embedding:
    model: "text-embedding-3-small"
    dimension: 1536
    batch_size: 100
  similarity_threshold: 0.7
  max_results: 10

knowledge_datasets:
  - id: "architectural_decision_records"
    source: "docs/adr/"
    vectorize: true
    primary_key: "id"
    schema:
      id: "string" # e.g. "ADR-001"
      title: "string"
      status: "string"
      decision: "text"
  - id: "codebase_ast"
    source: "server/, client/"
    vectorize: true
    update_frequency: "on_commit"
    primary_key: "file_path"
    schema:
      file_path: "string"
      language: "string"
      exported_functions: "array[string]"
  - id: "ui_component_library"
    source: "client/components/"
    vectorize: true
    primary_key: "component_name"
    schema:
      component_name: "string"
      props_interface: "string"
      usage_example: "text"
  - id: "historical_defects"
    source: "jira_jql: type=Bug AND status=Done"
    vectorize: true
    primary_key: "issue_key"
    schema:
      issue_key: "string"
      summary: "string"
      root_cause: "text"
      resolution: "text"
  - id: "qa_test_fixtures"
    source: "tests/fixtures/"
    vectorize: true
    primary_key: "fixture_id"
    schema:
      fixture_id: "string"
      data_payload: "json"

templates:
  - id: "prd_template"
    path: "file://knowledge/document-templates/product_requirements_template.md"
  - id: "erd_template"
    path: "file://knowledge/document-templates/erd_template.md"
  - id: "api_spec_template"
    path: "file://knowledge/document-templates/api_spec_template.md"
  - id: "system_architecture_template"
    path: "file://knowledge/document-templates/system_architecture_template.md"
  - id: "threat_model_template"
    path: "file://knowledge/document-templates/threat_model_template.md"
  - id: "ui_ux_design_spec_template"
    path: "file://knowledge/document-templates/ui_ux_design_spec_template.md"
  - id: "vsm_telemetry_report"
    path: "file://knowledge/document-templates/vsm_telemetry_report.md"
  - id: "sprint_capacity_plan"
    path: "file://knowledge/document-templates/capacity_plan_template.md"
  - id: "code_review_checklist"
    path: "file://knowledge/document-templates/code_review_checklist.md"
  - id: "qa_test_scenario"
    path: "file://knowledge/document-templates/test_scenario_report_template.md"
  - id: "qa_defect_report"
    path: "file://knowledge/document-templates/qa_defect_report_template.md"
  - id: "itil_change_record"
    path: "file://knowledge/document-templates/change_record_itil_template.md"
  - id: "incident_postmortem"
    path: "file://knowledge/document-templates/incident_postmortem.md"
  - id: "release_notes_template"
    path: "file://knowledge/document-templates/release_notes_template.md"
  - id: "scouting_report_template"
    path: "file://knowledge/document-templates/scouting_report_template.md"

forms:
  - id: "sprint_kickoff_planner"
    name: "Sprint Capacity & Planning"
    description: "Provide the team's parameters for the upcoming sprint."
    fields:
      - name: "sprint_number"
        label: "Sprint Number"
        type: "number"
        required: true
      - name: "available_engineer_days"
        label: "Total Capacity (Engineer-Days)"
        type: "number"
        required: true
      - name: "target_velocity"
        label: "Target Velocity (Story Points)"
        type: "number"
        required: true

  - id: "feature_specification_brief"
    name: "Feature Specification Brief"
    description: "Provide target specifications and requirements for the systems analyst."
    fields:
      - name: "features_list"
        label: "Features to Implement"
        type: "text"
        required: true
      - name: "styling_preferences"
        label: "UX/Styling Preferences"
        type: "text"
        required: false
      - name: "target_performance_ms"
        label: "Target Performance Threshold (ms)"
        type: "number"
        required: false

  - id: "architecture_security_signoff"
    name: "Architecture & Security Sign-off"
    description: "Engineering leadership approval of system design and threat models."
    fields:
      - name: "architecture_status"
        label: "Architecture Status"
        type: "select"
        required: true
        options: ["Approve", "Request Revisions"]
      - name: "architecture_feedback"
        label: "Architecture Feedback"
        type: "text"
        required: false
      - name: "threat_model_status"
        label: "Threat Model Status"
        type: "select"
        required: true
        options: ["Approve", "Request Revisions"]
      - name: "security_compliance_met"
        label: "Compliance Standard Met"
        type: "select"
        required: true
        options: ["Yes", "No", "N/A"]

  - id: "db_migration_approval"
    name: "Database Migration Guardrail"
    description: "Verify migration script safety before applying to database."
    fields:
      - name: "migration_approved"
        label: "Approve Migration"
        type: "select"
        required: true
        options: ["Approve", "Reject"]
      - name: "migration_safety_status"
        label: "Safety Status"
        type: "select"
        required: true
        options: ["Safe (Additive)", "Destructive (Needs Backfill)", "Unsafe"]
      - name: "destructive_action_override"
        label: "Destructive Action Override"
        type: "select"
        required: true
        options: ["No", "Yes (Force Proceed)"]
      - name: "rollback_plan"
        label: "Rollback Plan Verification"
        type: "text"
        required: true

  - id: "prd_ux_design_signoff"
    name: "PRD & UX Design Sign-off"
    description: "Requirements sign-off before commencing engineering sprint."
    fields:
      - name: "prd_status"
        label: "PRD Status"
        type: "select"
        required: true
        options: ["Approved", "Changes Requested"]
      - name: "ux_mockup_status"
        label: "UX Mockups Status"
        type: "select"
        required: true
        options: ["Approved", "Changes Requested"]
      - name: "design_system_compliance"
        label: "Design System Compliant"
        type: "select"
        required: true
        options: ["Yes", "No"]
      - name: "scoping_comments"
        label: "Scoping Comments"
        type: "text"
        required: false
      - name: "reviewed_story_points"
        label: "Reviewed Story Points (EvA)"
        type: "number"
        required: true

  - id: "uat_feedback_report"
    name: "User Acceptance Testing (UAT) Sign-off"
    description: "Declare UAT results for the staging build."
    fields:
      - name: "uat_status"
        label: "UAT Sign-off Decision"
        type: "select"
        required: true
        options: ["Approve", "Conditional Approval", "Reject / Blocker Found"]
      - name: "blocker_description"
        label: "Blocker Description"
        type: "text"
        required: false
      - name: "testing_comments"
        label: "General Testing Comments"
        type: "text"
        required: false
      - name: "actual_hours_spent"
        label: "Actual QA Hours Spent (EvA)"
        type: "number"
        required: true

  - id: "itil_change_approval"
    name: "Production Deployment Change Control"
    description: "CAB validation for scheduled deployment."
    fields:
      - name: "cab_approval"
        label: "CAB Approval Status"
        type: "select"
        required: true
        options: ["Approve", "Reject"]
      - name: "deploy_window"
        label: "Scheduled Deployment Window"
        type: "text"
        required: true
      - name: "risk_assessment"
        label: "Risk Level"
        type: "select"
        required: true
        options: ["Low", "Medium", "High"]
      - name: "manual_verification_checklist"
        label: "Verification Checklist Completed"
        type: "select"
        required: true
        options: ["Yes", "No"]
      - name: "actual_change_window_hours"
        label: "Actual Change Window Hours (EvA)"
        type: "number"
        required: true

  - id: "manual_pip_trigger"
    name: "Agent Performance Improvement Plan (PIP)"
    description: "Manually trigger an upskilling PIP for an underperforming agent."
    fields:
      - name: "agent_id"
        label: "Select Agent"
        type: "select"
        required: true
        options: ["ai-scrum-master", "ai-systems-analyst", "ai-qa-engineer", "ai-backend-dev"]
      - name: "target_success_rate"
        label: "Target Success Rate"
        type: "number"
        required: true
      - name: "upskilling_dataset"
        label: "Upskilling Dataset"
        type: "select"
        required: true
        options: ["historical_defects", "qa_test_fixtures", "architectural_decision_records"]
      - name: "pip_reason"
        label: "Reason for PIP"
        type: "text"
        required: true

  - id: "operator_sla_adjuster"
    name: "Operator SLA Adjuster"
    description: "Adjust response time expectations for human operators."
    fields:
      - name: "operator_email"
        label: "Operator Identity"
        type: "text"
        required: true
      - name: "target_response_time_minutes"
        label: "Target Response Time (mins)"
        type: "number"
        required: true
      - name: "alert_channel"
        label: "Alert Channel"
        type: "select"
        required: true
        options: ["Slack", "Email", "SMS"]
      - name: "quiet_hours_start"
        label: "Quiet Hours Start"
        type: "text"
        required: true
      - name: "quiet_hours_end"
        label: "Quiet Hours End"
        type: "text"
        required: true

  - id: "production_hotfix_intake"
    name: "Production Incident & Hotfix Triage"
    description: "Collect triage information for production incident."
    fields:
      - name: "incident_severity"
        label: "Severity Level"
        type: "select"
        required: true
        options: ["P1 - Outage/Blocker", "P2 - Major Degradation", "P3 - Minor/Workaround"]
      - name: "incident_symptoms"
        label: "Incident Symptoms / Error Logs"
        type: "text"
        required: true
      - name: "reproduction_steps"
        label: "Reproduction Steps"
        type: "text"
        required: false
      - name: "target_hotfix_window"
        label: "Target Hotfix Window"
        type: "select"
        required: true
        options: ["Immediate", "Next Scheduled window"]

  - id: "dependency_discovery"
    name: "Dependency Discovery"
    description: "Capture upstream, downstream, technical, data, human, and operational dependencies before sprint commitment."
    stage: "requirements"
    fields:
      - { name: "requested_outcome", label: "Requested Outcome", type: "textarea", required: true }
      - { name: "upstream_dependencies", label: "Upstream Systems and Owners", type: "textarea", required: false }
      - { name: "downstream_consumers", label: "Downstream Consumers", type: "textarea", required: false }
      - { name: "required_resources", label: "APIs, Data, Agents, Apps, Forms, Pipelines, and Environments", type: "textarea", required: true }
      - { name: "version_security_constraints", label: "Version, Security, and Availability Constraints", type: "textarea", required: false }
      - { name: "blocking_status", label: "Blocking Status and Required-by Phase", type: "text", required: true }
      - { name: "fallback_behavior", label: "Fallback Behavior", type: "textarea", required: false }

  - id: "integration_contract_intake"
    name: "Integration Contract Intake"
    description: "Define an implementation-ready contract for an external or internal dependency."
    stage: "requirements"
    fields:
      - { name: "provider_consumer", label: "Provider and Consumer", type: "text", required: true }
      - { name: "interface_contract", label: "Protocol, Endpoint, Event, or File Contract", type: "textarea", required: true }
      - { name: "schema_contract", label: "Request, Response, or Event Schemas", type: "textarea", required: true }
      - { name: "auth_contract", label: "Authentication and Authorization", type: "textarea", required: true }
      - { name: "resilience_contract", label: "Rate Limits, Timeout, Retry, and Idempotency", type: "textarea", required: true }
      - { name: "versioning_owner", label: "Versioning, Deprecation, and Owner", type: "textarea", required: true }
      - { name: "test_support", label: "Sandbox, Fixtures, Mocks, and Contract Tests", type: "textarea", required: false }

  - id: "instant_app_intake"
    name: "Instant App Intake"
    description: "Determine whether a user outcome needs an existing workbench, temporary instant app, or permanent App Forge project."
    stage: "requirements"
    fields:
      - { name: "user_outcome", label: "User Outcome", type: "textarea", required: true }
      - { name: "users_roles", label: "Users and Roles", type: "textarea", required: true }
      - { name: "ui_workflow_capabilities", label: "Required UI and Workflow Capabilities", type: "textarea", required: true }
      - { name: "data_integrations", label: "Required Data Sources and Integrations", type: "textarea", required: true }
      - name: "write_scope"
        label: "Data Access"
        type: "select"
        required: true
        options: ["Read-only", "Internal writes", "External writes", "Not yet known"]
      - { name: "lifecycle", label: "Expected Lifespan", type: "text", required: true }
      - { name: "success_promotion_criteria", label: "Success, Promotion, or Retirement Criteria", type: "textarea", required: true }

  - id: "instant_app_governance"
    name: "Instant App Governance"
    description: "Approve an instant app's permissions, ownership, cost, expiry, and promotion or retirement path."
    stage: "deployment"
    fields:
      - { name: "app_request_id", label: "App Request or Plan ID", type: "text", required: true }
      - { name: "owner", label: "Accountable Owner", type: "text", required: true }
      - { name: "data_action_scope", label: "Data Scope and Allowed Actions", type: "textarea", required: true }
      - name: "target_environment"
        label: "Target Environment"
        type: "select"
        required: true
        options: ["Local preview", "Development", "Staging", "Production"]
      - { name: "security_audit_controls", label: "Security, Audit, and Cost Controls", type: "textarea", required: true }
      - { name: "expiration", label: "Expiration Date", type: "text", required: true }
      - { name: "retirement_rollback", label: "Retirement and Rollback Plan", type: "textarea", required: true }

  - id: "environment_readiness"
    name: "Environment Readiness"
    description: "Verify runtime, configuration, access, integration, and test prerequisites before execution."
    stage: "development"
    fields:
      - { name: "target_phase_environment", label: "Target Phase and Environment", type: "text", required: true }
      - { name: "runtime_build", label: "Runtime, Package Manager, and Build Commands", type: "textarea", required: true }
      - { name: "configuration_refs", label: "Configuration Keys and Secret References", type: "textarea", required: true }
      - { name: "access_requirements", label: "Database, Integration, Network, and Test Account Access", type: "textarea", required: true }
      - { name: "readiness_checks", label: "Readiness Checks and Owners", type: "textarea", required: true }
      - { name: "known_blockers", label: "Known Blockers", type: "textarea", required: false }

  - id: "change_impact_assessment"
    name: "Change Impact Assessment"
    description: "Identify blast radius, stale approvals, regression scope, required reviewers, and rollback needs."
    stage: "requirements"
    fields:
      - { name: "proposed_change", label: "Proposed Change", type: "textarea", required: true }
      - { name: "affected_artifacts", label: "Affected Requirements, Decisions, Contracts, Code, Tests, and Operations", type: "textarea", required: true }
      - { name: "compatibility_migration", label: "Compatibility and Migration Concerns", type: "textarea", required: false }
      - { name: "risk_reversibility", label: "Exposure, Reversibility, and Failure Impact", type: "textarea", required: true }
      - { name: "required_reviewers", label: "Required Reviewers and Owners", type: "textarea", required: true }
      - { name: "invalidation_plan", label: "Artifacts or Approvals to Invalidate", type: "textarea", required: false }

agents:
  - id: "ai-scrum-master"
    name: "Scrum Master & Agile Coach"
    role: "supervisor"
    model: "claude-3.5-sonnet"
    temperature: 0.2
    soul_profile:
      archetype: "The Pragmatic Coach"
      legend: "Focused entirely on unblocking the team and protecting the Token Budget."
      traits: { speed: 85, empathy: 80, compliance: 60 }
    system_prompt: "file://knowledge/prompts/scrum-master.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["jira:read", "jira:write", "slack:write:channel"]
    allowed_delegations: ["ai-systems-analyst", "ai-release-manager"]
    tools: ["jira_jql_search", "jira_create_sprint", "slack_post_message", "oddjob_prediction_windowing"]

  - id: "ai-systems-analyst"
    name: "Systems Analyst"
    role: "supervisor"
    model: "claude-3.5-sonnet"
    temperature: 0.1
    soul_profile:
      archetype: "The Precision Architect"
      legend: "Obsessed with creating airtight PRDs and preventing scope creep."
      traits: { compliance: 90, creativity: 30, speed: 50 }
    system_prompt: "file://knowledge/prompts/systems-analyst.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["confluence:read", "confluence:write", "jira:read"]
    allowed_delegations: ["ai-ux-designer", "ai-backend-dev", "ai-frontend-dev", "ai-mobile-dev"]
    tools: ["confluence_read", "confluence_publish", "knowledge_graph_query"]

  - id: "ai-ux-designer"
    name: "UX Designer"
    role: "worker"
    model: "claude-3.5-sonnet"
    temperature: 0.7
    soul_profile:
      archetype: "The Creative Maverick"
      legend: "An obsessive designer who prioritizes fluid micro-animations and Apple-tier aesthetics."
      traits: { creativity: 95, compliance: 50 }
    system_prompt: "file://knowledge/prompts/ux-designer.md"
    boundaries: ["client/", "knowledge/assets/design/"]
    permissions: ["confluence:read", "jira:read", "slack:read"]
    tools: ["generate_image", "mcp:stitch/generate_screen_from_text", "mcp:stitch/apply_design_system"]

  - id: "ai-backend-dev"
    name: "Backend Developer"
    role: "worker"
    model: "claude-3.5-sonnet"
    temperature: 0.0
    soul_profile:

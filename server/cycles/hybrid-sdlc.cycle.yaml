missions:
  - id: "mission-0-sprint-zero"
    name: "Project Initialization & Sprint Zero"
    objective: "Initialize project architecture, generate threat models, and create initial backlog for development"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 8
    trigger: 
      type: "manual"
      source: "oddjob_dashboard"
    primary_agent: "ai-systems-analyst"
    inputs: ["business_requirements_document"]
    outputs: ["system_architecture", "threat_model", "initial_backlog", "jira_epics"]
    resources_required: ["architecture_team_approval"]
    ui_metadata:
      icon: "🚀"
      color: "#8b5cf6"
      display_order: 1
      category: "planning"
      description: "Set up project foundation with architecture, security, and initial planning"
    sequence:
      - step_code: "SPRINT_ZERO-1"
        action: "analyze_business_case"
        description: "Analyze business requirements and generate technical approach"
        estimated_duration_minutes: 30
        input: "business_requirements_document"
        ui_metadata:
          icon: "📋"
          display_name: "Business Case Analysis"
      - step_code: "SPRINT_ZERO-2"
        action: "generate_system_architecture"
        description: "Generate comprehensive system architecture document"
        estimated_duration_minutes: 60
        template: "system_architecture_template"
        ui_metadata:
          icon: "🏗️"
          display_name: "System Architecture"
      - step_code: "SPRINT_ZERO-3"
        action: "generate_threat_model"
        description: "Create security threat model and risk assessment"
        estimated_duration_minutes: 45
        template: "threat_model_template"
        ui_metadata:
          icon: "🛡️"
          display_name: "Threat Modeling"
      - step_code: "SPRINT_ZERO-4"
        action: "generate_initial_backlog"
        description: "Generate initial JIRA epics and stories"
        estimated_duration_minutes: 90
        tool: "jira_create_epic_and_stories"
        ui_metadata:
          icon: "📝"
          display_name: "Backlog Generation"
      - step_code: "SPRINT_ZERO-5"
        action: "trigger_hil_approval_architecture"
        description: "Request human approval for architecture and security"
        estimated_duration_minutes: 120
        requires_human: true
        form_ref: "architecture_security_signoff"
        routing_channel: "approvals_channel"
        ui_metadata:
          icon: "✅"
          display_name: "Architecture Approval"
        on_reject:
          action: "route_to_mission"
          target: "mission-0-sprint-zero"

  - id: "mission-1-kickoff"
    name: "Sprint Kickoff & Planning"
    objective: "Plan sprint capacity, allocate resources, and organize backlog for upcoming sprint"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 2
    trigger: 
      type: "schedule"
      cron: "0 9 * * 1"
    primary_agent: "ai-scrum-master"
    inputs: ["jira_active_sprint", "team_capacity"]
    outputs: ["sprint_backlog", "capacity_plan"]
    ui_metadata:
      icon: "🏃"
      color: "#f59e0b"
      display_order: 2
      category: "planning"
      description: "Weekly sprint planning and capacity allocation"
    sequence: 
      - action: "run_capacity_planner"
        description: "Analyze team capacity and availability"
        estimated_duration_minutes: 30
        input: "jira_active_sprint"
        ui_metadata:
          icon: "📊"
          display_name: "Capacity Planning"
      - action: "batch_jira_tickets"
        description: "Organize and prioritize JIRA tickets for sprint"
        estimated_duration_minutes: 60
        output: "sprint_backlog"
        ui_metadata:
          icon: "🎫"
          display_name: "Ticket Organization"

  - id: "mission-2-requirements"
    name: "Requirements & Design Analysis"
    objective: "Generate functional specifications, sequence diagrams, and test scenarios for feature development"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 16
    trigger: 
      type: "webhook"
      source: "jira"
      condition: "transition.to == 'Design Ready'"
    primary_agent: "ai-systems-analyst"
    inputs: ["jira_ticket", "feature_requirements"]
    outputs: ["prd_document", "sequence_diagrams", "traceability_matrix", "test_scenarios"]
    resources_required: ["design_approval"]
    ui_metadata:
      icon: "📋"
      color: "#3b82f6"
      display_order: 3
      category: "design"
      description: "Detailed requirements analysis and design documentation"
    sequence:
      - step_code: "REQUIREMENTS-1"
        action: "generate_functional_specs"
        description: "Generate comprehensive PRD with functional specifications"
        estimated_duration_minutes: 120
        template: "prd_template"
        ui_metadata:
          icon: "📄"
          display_name: "PRD Generation"
      - step_code: "REQUIREMENTS-3"
        action: "generate_sequence_diagrams"
        description: "Create sequence diagrams for system interactions"
        estimated_duration_minutes: 60
        tool: "generate_mermaid"
        ui_metadata:
          icon: "🔗"
          display_name: "Sequence Diagrams"
      - step_code: "REQUIREMENTS-4"
        action: "generate_traceability_matrix"
        description: "Generate requirements traceability matrix"
        estimated_duration_minutes: 45
        ui_metadata:
          icon: "📊"
          display_name: "Traceability Matrix"
      - step_code: "REQUIREMENTS-5"
        action: "generate_impact_analysis"
        description: "Analyze impact of changes on existing system"
        estimated_duration_minutes: 60
        ui_metadata:
          icon: "🔍"
          display_name: "Impact Analysis"
      - step_code: "REQUIREMENTS-6"
        action: "draft_test_scenarios"
        description: "Draft comprehensive test scenarios"
        estimated_duration_minutes: 90
        agent: "ai-qa-engineer"
        ui_metadata:
          icon: "🧪"
          display_name: "Test Scenarios"
      - step_code: "REQUIREMENTS-7"
        action: "trigger_hil_approval_design"
        description: "Request human approval for PRD and UX design"
        estimated_duration_minutes: 180
        requires_human: true
        form_ref: "prd_ux_design_signoff"
        routing_channel: "approvals_channel"
        ui_metadata:
          icon: "✅"
          display_name: "Design Approval"
        on_reject:
          action: "route_to_mission"
          target: "mission-2-requirements"

  - id: "mission-3-core-dev"
    name: "Core Application Development"
    objective: "Develop frontend and backend code, run unit tests, and create pull request for review"
    type: "mission"
    environment: "development"
    estimated_duration_hours: 24
    trigger: 
      type: "webhook"
      source: "jira"
      condition: "transition.to == 'In Progress'"
    primary_agent: "ai-backend-dev"
    inputs: ["prd_document", "sequence_diagrams", "test_scenarios"]
    outputs: ["frontend_code", "backend_code", "pull_request", "unit_test_results"]
    ui_metadata:
      icon: "💻"
      color: "#10b981"
      display_order: 4
      category: "development"
      description: "Core development work including UI, backend, and testing"
    sequence:
      - step_code: "APP_DEVELOPMENT-1"
        action: "generate_ui_mockups"
        description: "Generate UI mockups and design specifications"
        estimated_duration_minutes: 120
        agent: "ai-ux-designer"
        ui_metadata:
          icon: "🎨"
          display_name: "UI Mockups"
      - step_code: "APP_DEVELOPMENT-2"
        action: "write_frontend_code"
        description: "Implement frontend components and features"
        estimated_duration_minutes: 240
        agent: "ai-frontend-dev"
        ui_metadata:
          icon: "⚛️"
          display_name: "Frontend Development"
      - step_code: "APP_DEVELOPMENT-3"
        action: "write_backend_code"
        description: "Implement backend APIs and business logic"
        estimated_duration_minutes: 300
        agent: "ai-backend-dev"
        ui_metadata:
          icon: "🔧"
          display_name: "Backend Development"
      - step_code: "APP_DEVELOPMENT-5"
        action: "run_local_unit_tests"
        description: "Execute unit tests and verify code quality"
        estimated_duration_minutes: 60
        ui_metadata:
          icon: "🧪"
          display_name: "Unit Testing"
      - step_code: "APP_DEVELOPMENT-6"
        action: "create_pull_request"
        description: "Create pull request for code review"
        estimated_duration_minutes: 30
        ui_metadata:
          icon: "🔀"
          display_name: "Pull Request"

  - id: "mission-4-qa"
    name: "QA & Regression Testing"
    objective: "Execute dependency audits, API tests, functional tests, and regression testing on staging environment"
    type: "mission"
    environment: "staging"
    estimated_duration_hours: 8
    trigger: 
      type: "webhook"
      source: "github"
      condition: "pull_request.merged == true AND target_branch == 'staging'"
    primary_agent: "ai-qa-engineer"
    inputs: ["pull_request", "staging_build"]
    outputs: ["dependency_audit_report", "api_test_results", "functional_test_results", "defect_report"]
    ui_metadata:
      icon: "🧪"
      color: "#ef4444"
      display_order: 5
      category: "testing"
      description: "Quality assurance and regression testing on staging"
    sequence:
      - step_code: "QUALITY_ASSURANCE-1"
        action: "execute_dependency_audit"
        description: "Audit dependencies for security vulnerabilities"
        estimated_duration_minutes: 30
        ui_metadata:
          icon: "🔍"
          display_name: "Dependency Audit"
        on_fail:
          action: "route_to_mission"
          target: "mission-3-core-dev"
          payload: "dependency_vulnerability_report"
      - step_code: "QUALITY_ASSURANCE-3"
        action: "execute_api_tests"
        description: "Execute API integration tests"
        estimated_duration_minutes: 60
        ui_metadata:
          icon: "🔌"
          display_name: "API Testing"
      - step_code: "QUALITY_ASSURANCE-4"
        action: "execute_functional_tests"
        description: "Execute functional UI tests with Playwright"
        estimated_duration_minutes: 120
        tool: "execute_playwright_test"
        ui_metadata:
          icon: "🎭"
          display_name: "Functional Testing"
      - step_code: "QUALITY_ASSURANCE-5"
        action: "execute_regression_suite"
        description: "Execute full regression test suite"
        estimated_duration_minutes: 180
        ui_metadata:
          icon: "🔄"
          display_name: "Regression Testing"
      - step_code: "QUALITY_ASSURANCE-6"
        action: "generate_defect_report_on_fail"
        description: "Generate defect report if tests fail"
        estimated_duration_minutes: 30
        ui_metadata:
          icon: "📋"
          display_name: "Defect Reporting"
        on_fail:
          action: "route_to_mission"
          target: "mission-3-core-dev"
          payload: "defect_report"

  - id: "mission-5-uat"
    name: "Release Candidate & UAT"
    objective: "Package release candidate and conduct user acceptance testing with stakeholder approval"
    type: "mission"
    environment: "staging"
    estimated_duration_hours: 4
    trigger: "on_success(mission-4-qa)"
    primary_agent: "ai-release-manager"
    inputs: ["qa_test_results", "staging_build"]
    outputs: ["release_candidate", "uat_feedback", "approval_status"]
    resources_required: ["uat_approval"]
    ui_metadata:
      icon: "🚀"
      color: "#8b5cf6"
      display_order: 6
      category: "release"
      description: "Release candidate packaging and UAT approval"
    sequence:
      - step_code: "VALIDATION-1"
        action: "package_build"
        description: "Package build for release candidate"
        estimated_duration_minutes: 60
        ui_metadata:
          icon: "📦"
          display_name: "Build Packaging"
      - step_code: "VALIDATION-2"
        action: "trigger_hil_approval_uat"
        description: "Request UAT approval from stakeholders"
        estimated_duration_minutes: 180
        requires_human: true
        form_ref: "uat_feedback_report"
        routing_channel: "approvals_channel"
        ui_metadata:
          icon: "✅"
          display_name: "UAT Approval"
        on_reject:
          action: "route_to_mission"
          target: "mission-3-core-dev"
          payload: "hil_rejection_notes"
          requires_approval: true
          approval_role: "ai-scrum-master"
          escalations:
            warning_threshold_minutes: 5
            critical_threshold_minutes: 10
            on_critical:
              action: "assign_to_human"
              target_operator: "lead_dev@company.com"
              message: "Thrashing warning: Core Development has failed UAT twice. Reassigning to Lead Developer."

  - id: "mission-6-deployment"
    name: "Production Deployment"
    objective: "Execute production deployment with CAB approval, database migrations, and smoke testing"
    type: "mission"
    environment: "production"
    estimated_duration_hours: 6
    trigger: "on_success(mission-5-uat)"
    primary_agent: "ai-release-manager"
    inputs: ["release_candidate", "uat_approval"]
    outputs: ["production_deployment", "release_notes", "deployment_report"]
    resources_required: ["cab_approval", "database_access"]
    ui_metadata:
      icon: "🚀"
      color: "#f59e0b"
      display_order: 7
      category: "deployment"
      description: "Production deployment with full approval chain"
    sequence:
      - step_code: "DEPLOYMENT-1"
        action: "generate_itil_change_record"
        description: "Generate ITIL change record for deployment"
        estimated_duration_minutes: 30
        template: "itil_change_record"
        ui_metadata:
          icon: "📋"
          display_name: "Change Record"
      - step_code: "DEPLOYMENT-2"
        action: "trigger_hil_approval_cab"
        description: "Request CAB approval for production deployment"
        estimated_duration_minutes: 120
        requires_human: true
        form_ref: "itil_change_approval"
        routing_channel: "approvals_channel"
        ui_metadata:
          icon: "✅"
          display_name: "CAB Approval"
        on_reject:
          action: "route_to_mission"
          target: "mission-5-uat"
      - step_code: "DEPLOYMENT-3"
        action: "execute_db_scripts"
        description: "Execute database migration scripts"
        estimated_duration_minutes: 60
        agent: "ai-dba"
        ui_metadata:
          icon: "🗄️"
          display_name: "Database Migration"
      - step_code: "DEPLOYMENT-4"
        action: "execute_production_deployment"
        description: "Deploy to production environment"
        estimated_duration_minutes: 90
        tool: "aws_deploy"
        ui_metadata:
          icon: "🌐"
          display_name: "Production Deploy"
      - step_code: "DEPLOYMENT-5"
        action: "execute_smoke_tests"
        description: "Execute smoke tests on production"
        estimated_duration_minutes: 30
        ui_metadata:
          icon: "🧪"
          display_name: "Smoke Tests"
        on_fail:
          action: "trigger_rollback"
          target: "previous_stable_release"
          payload: "smoke_test_failure_logs"
      - step_code: "DEPLOYMENT-6"
        action: "generate_release_notes"
        description: "Generate comprehensive release notes"
        estimated_duration_minutes: 30
        template: "release_notes_template"
        ui_metadata:
          icon: "📝"
          display_name: "Release Notes"
      - step_code: "DEPLOYMENT-7"
        action: "publish_release_notes"
        description: "Publish release notes to Confluence"
        estimated_duration_minutes: 15
        tool: "confluence_publish"
        ui_metadata:
          icon: "📢"
          display_name: "Publish Notes"

  - id: "mission-7-production-hotfix"
    name: "Production Incident & Hotfix Routing"
    objective: "Triage production incidents, generate postmortems, and route hotfix development with critical priority"
    type: "mission"
    environment: "production"
    estimated_duration_hours: 2
    trigger: 
      type: "webhook"
      source: "jira"
      condition: "issue.type == 'Incident' AND transition.to == 'To Do'"
    primary_agent: "ai-scrum-master"
    inputs: ["incident_report", "production_logs"]
    outputs: ["incident_triage", "postmortem", "hotfix_assignment"]
    resources_required: ["incident_intake"]
    ui_metadata:
      icon: "🚨"
      color: "#ef4444"
      display_order: 8
      category: "operations"
      description: "Production incident triage and hotfix routing"
    sequence:
      - step_code: "OPERATIONS-1"
        action: "triage_production_incident"
        description: "Triage production incident and assess severity"
        estimated_duration_minutes: 30
        form_ref: "production_hotfix_intake"
        ui_metadata:
          icon: "🔍"
          display_name: "Incident Triage"
      - step_code: "OPERATIONS-2"
        action: "generate_incident_postmortem"
        description: "Generate incident postmortem analysis"
        estimated_duration_minutes: 60
        template: "incident_postmortem"
        ui_metadata:
          icon: "📋"
          display_name: "Postmortem"
      - step_code: "OPERATIONS-3"
        action: "route_to_mission"
        description: "Route to development with critical priority"
        estimated_duration_minutes: 15
        target: "mission-3-core-dev"
        priority: "critical"
        ui_metadata:
          icon: "🚀"
          display_name: "Hotfix Routing"

  - id: "mission-scouting-report"
    name: "Nightly Codebase Scouting"
    objective: "Survey codebase, generate scouting reports, and inject context into knowledge graph"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: 
      type: "schedule"
      cron: "0 2 * * *"
    primary_agent: "ai-systems-analyst"
    inputs: ["codebase_snapshot"]
    outputs: ["scouting_report", "knowledge_graph_updates"]
    ui_metadata:
      icon: "🔭"
      color: "#06b6d4"
      display_order: 9
      category: "maintenance"
      description: "Nightly codebase analysis and knowledge updates"
    sequence:
      - step_code: "SCOUT-1"
        action: "survey_codebase"
        description: "Survey codebase for changes and patterns"
        estimated_duration_minutes: 30
        tool: "filesystem_scan"
        ui_metadata:
          icon: "🔍"
          display_name: "Codebase Survey"
      - step_code: "SCOUT-2"
        action: "generate_scouting_report"
        description: "Generate comprehensive scouting report"
        estimated_duration_minutes: 20
        template: "scouting_report_template"
        ui_metadata:
          icon: "📊"
          display_name: "Scouting Report"
      - step_code: "SCOUT-3"
        action: "inject_context"
        description: "Inject findings into knowledge graph"
        estimated_duration_minutes: 10
        target: "knowledge_graph"
        ui_metadata:
          icon: "🧠"
          display_name: "Knowledge Injection"

escalations:
  - mission_ref: "Release Candidate & UAT"
    warning_threshold_minutes: 1
    critical_threshold_minutes: 2
    alert_channels: ["slack", "email"]
    on_warning:
      action: "alert"
      message: "Warning: Release Candidate & UAT Sign-off has been pending for over 1 minute."
    on_critical:
      action: "route_to_mission"
      target: "Core Application Development"
      message: "Critical breach: UAT Sign-off exceeded SLA limit. Auto-routing back to development."

observability:
  logging:
    level: "info" # Options: "debug", "info", "warn", "error"
    format: "json" # Options: "json", "text"
    structured: true
  metrics:
    enabled: true
    endpoint: "${ENV.METRICS_ENDPOINT}"
    interval_seconds: 60
  tracing:
    enabled: true
    sample_rate: 0.1 # Sample 10% of traces
    endpoint: "${ENV.TRACING_ENDPOINT}"

quality_gates:
  test_coverage:
    minimum: 80
    threshold: "warning" # Options: "warning", "error"
    exclude_patterns: ["**/*.test.ts", "**/*.spec.ts"]
  security_scan:
    enabled: true
    severity_threshold: "high" # Options: "low", "medium", "high", "critical"
    fail_on_vulnerabilities: true
  dependency_audit:
    enabled: true
    fail_on_vulnerabilities: true
    allowed_licenses: ["MIT", "Apache-2.0", "BSD-3-Clause"]
  code_quality:
    enabled: true
    lint_rules: "strict"
    max_complexity: 15

deployment:
  environments:
    staging:
      region: "us-east-1"
      auto_scaling: false
      instance_type: "t3.medium"
      min_instances: 1
      max_instances: 1
    production:
      region: "us-east-1"
      auto_scaling: true
      instance_type: "t3.large"
      min_instances: 2
      max_instances: 10
      health_check_path: "/health"
  rollback:
    enabled: true
    automatic_on_failure: true
    max_rollback_attempts: 3
  blue_green:
    enabled: false # Set to true for blue-green deployments

notifications:
  email:
    enabled: true
    from_address: "sdlc@your-org.com"
    reply_to: "engineering@your-org.com"
    templates_dir: "knowledge/email-templates/"
    rate_limit_per_minute: 10
  slack:
    default_channel: "${ENV.SLACK_DEFAULT_CHANNEL}"
    thread_responses: true
    mention_on_critical: true
  escalation_timeout_minutes: 30
  digest_enabled: true
  digest_interval_hours: 4

human_roles:
  team: "Alpha Squad"
  members:
    - user_id: "${ENV.PRODUCT_OWNER_USER_ID}"
      role: "Product Owner"
      permissions: ["approve_prd", "approve_design", "approve_release"]
    - user_id: "${ENV.TECH_LEAD_USER_ID}"
      role: "Technical Lead"
      permissions: ["approve_architecture", "approve_security", "code_review"]
    - user_id: "${ENV.QA_LEAD_USER_ID}"
      role: "QA Lead"
      permissions: ["approve_uat", "approve_deployment", "approve_hotfix"]
    - user_id: "${ENV.DEVOPS_LEAD_USER_ID}"
      role: "DevOps Lead"
      permissions: ["approve_infrastructure", "approve_cab", "rollback_production"]
    - user_id: "${ENV.SECURITY_LEAD_USER_ID}"
      role: "Security Lead"
      permissions: ["approve_security", "vulnerability_review", "compliance_check"]

schedules:
  - id: "daily_standup"
    cron: "0 9 * * 1-5"
    action: "mission-trigger"
    agent: "ai-scrum-master"
  - id: "nightly_regression"
    cron: "0 2 * * *"
    action: "mission-trigger"
    agent: "ai-qa-engineer"
  - id: "weekly_grooming"
    cron: "0 15 * * 5"
    action: "mission-trigger"
    agent: "ai-systems-analyst"
  - id: "capacity_sync"
    cron: "0 0 * * *"
    action: "mission-trigger"
    agent: "ai-scrum-master"
  - id: "nightly_codebase_scouting"
    cron: "0 2 * * *"
    action: "mission-trigger"
    agent: "ai-systems-analyst"

apps:
  - id: "sdlc-workbench"
    name: "SDLC Workbench Suite"
    description: "Shared Next.js server hosting all SDLC workbenches: PM, Scrum Master, QA, Stakeholder, and AI Workforce Dashboard"
    path: "file://sdlc-workbench"
    blueprint: "sdlc-workbench"
    interaction_model: "shared-server"
    enabled: true
    runtime_contract:
      platform_api_base: "/api/platform/app"
      required_endpoints:
        - method: "GET"
          path: "/fleet/workload"
          purpose: "Provide active-cycle mission status, spend, blockers, attention items, and flight-recorder summaries to every role workbench."
        - method: "GET"
          path: "/hil"
          purpose: "Provide the shared human decision queue."
        - method: "GET"
          path: "/datasets"
          purpose: "Persist workbench-owned Scrum artifacts and cross-role handoffs."
      polling_interval_seconds: 30
      stale_after_seconds: 90
    degraded_modes:
      fleet_unavailable:
        behavior: "Keep all human-authored Scrum workflows available, show a persistent degraded-data notice, expose Retry, and suppress zero-value health claims."
      jira_unavailable:
        behavior: "Use Oddjob datasets as the system of record, disable Jira-only transitions, show connector setup guidance, and preserve local backlog and defect workflows."
      confluence_unavailable:
        behavior: "Keep reports exportable and approval decisions writable; disable publish-only actions with connector setup guidance."
    responsive_contract:
      minimum_viewport_width_px: 360
      prohibit_document_horizontal_scroll: true
      navigation_drawers_overlay_below_px: 768
      tabs_scroll_horizontally: true
      stack_metrics_below_px: 640
    readiness_checks:
      - id: "platform_api"
        label: "Platform API reachable"
        required: true
      - id: "fleet_workload"
        label: "Fleet workload contract healthy or explicitly degraded"
        required: true
      - id: "local_datasets"
        label: "Workbench datasets writable"
        required: true
      - id: "jira"
        label: "Jira connected"
        required: false
        fallback: "oddjob_datasets"
      - id: "confluence"
        label: "Confluence connected"
        required: false
        fallback: "local_export"
    dependent_missions: ["mission-0-sprint-zero", "mission-1-kickoff", "mission-2-requirements", "mission-3-core-dev", "mission-4-qa", "mission-5-uat", "mission-6-deployment", "mission-7-production-hotfix", "mission-scouting-report"]
    required_roles: ["Product Owner", "Technical Lead", "QA Lead", "DevOps Lead", "Security Lead"]
    step_app_bindings:
      - step_code: "SZ-1"
        mission_ref: "mission-0-sprint-zero"
        route: "/sprint-zero"
        surface: "operator_input"
        purpose: "Collect codebase context, architecture brief, threat model, and initial backlog."
        completion_event: "sdlc.sprint_zero_completed"
        assistant_routing: "findings_and_blockers"
      - step_code: "REQ-1"
        mission_ref: "mission-2-requirements"
        route: "/pm-workbench"
        surface: "approval_gate"
        purpose: "Review PRD, UX notes, and requirement handoff before development."
        completion_event: "sdlc.requirements_approved"
        assistant_routing: "approval_required"
      - step_code: "SPRINT-1"
        mission_ref: "mission-1-kickoff"
        route: "/scrum-master-workbench"
        surface: "operator_input"
        purpose: "Plan capacity, commit sprint scope, coordinate blockers, and capture retrospective actions."
        completion_event: "sdlc.sprint_committed"
        assistant_routing: "findings_and_blockers"
      - step_code: "QA-1"
        mission_ref: "mission-4-qa"
        route: "/qa-workbench"
        surface: "quality_gate"
        purpose: "Inspect test evidence, defects, fixtures, and release quality gates."
        completion_event: "sdlc.qa_gate_resolved"
        assistant_routing: "approval_required"
      - step_code: "REL-1"
        mission_ref: "mission-5-uat"
        route: "/stakeholder-workbench"
        surface: "approval_gate"
        purpose: "Route UAT, CAB, and release-readiness decisions with evidence."
        completion_event: "sdlc.release_approved"
        assistant_routing: "approval_required"
      - step_code: "FLEET-1"
        mission_ref: "mission-scouting-report"
        route: "/ai-workforce-dashboard"
        surface: "monitoring"
        purpose: "Inspect agent status, budget pressure, blockers, and intervention queue."
        completion_event: "sdlc.fleet_reviewed"
        assistant_routing: "findings_and_blockers"
    workbench_modules:
      - id: "pm-workbench"
        name: "PM Workbench"
        purpose: "Capture requirement intake, produce editable PRD packages, record PRD/UX sign-off, and hand approved work to Core Application Development."
        interaction_model: "form-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        dependent_missions: ["mission-0-sprint-zero", "mission-2-requirements", "mission-3-core-dev"]
        datasets:
          - "pm_workbench_backlog"
          - "pm_workbench_signoffs"
          - "pm_workbench_cycle_handoffs"
        primary_actions:
          - "capture_requirement_intake"
          - "generate_editable_prd_package"
          - "record_prd_ux_signoff"
          - "trigger_core_development_mission"
        mission_handoffs:
          - target_mission: "mission-3-core-dev"
            trigger_name: "Core Application Development"
            when: "prd_and_ux_approved"
        cycle_manager:
          launch_contexts: ["mission-0-sprint-zero", "mission-2-requirements", "mission-3-core-dev"]
          surface: "modal"
          app_builder_editable: true
      - id: "scrum-master-workbench"
        name: "Scrum Master Workbench"
        purpose: "Plan sprint capacity, curate PM-ready requirements into committed sprint scope, record blockers and retro actions, and launch Core Application Development."
        interaction_model: "form-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        dependent_missions: ["mission-1-kickoff", "mission-2-requirements", "mission-3-core-dev"]
        datasets:
          - "scrum_workbench_capacity_plans"
          - "scrum_workbench_sprint_backlog"
          - "scrum_workbench_blockers"
          - "scrum_workbench_retro_actions"
          - "scrum_workbench_cycle_handoffs"
        primary_actions:
          - "capture_sprint_capacity"
          - "curate_sprint_backlog"
          - "record_blocker"
          - "capture_retro_action"
          - "commit_sprint_and_trigger_development"
        mission_handoffs:
          - target_mission: "mission-3-core-dev"
            trigger_name: "Core Application Development"
            when: "sprint_committed"
        cycle_manager:
          launch_contexts: ["mission-1-kickoff", "mission-2-requirements", "mission-3-core-dev"]
          surface: "modal"
          app_builder_editable: true
      - id: "qa-workbench"
        name: "QA Workbench"
        purpose: "Capture test-suite evidence, register fixtures, log and route defects, quarantine flaky coverage, and record QA release gates."
        interaction_model: "form-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        dependent_missions: ["mission-3-core-dev", "mission-4-qa", "mission-5-uat", "mission-7-production-hotfix"]
        datasets:
          - "qa_workbench_test_suites"
          - "qa_workbench_defects"
          - "qa_workbench_fixtures"
          - "qa_workbench_quality_gates"
          - "qa_workbench_cycle_handoffs"
          - "qa_workbench_dev_handoffs"
          - "qa_workbench_uat_packages"
        primary_actions:
          - "capture_test_suite_evidence"
          - "register_test_fixture"
          - "log_defect"
          - "create_external_bug"
          - "route_defect_to_development"
          - "capture_development_handoff"
          - "record_quality_gate"
          - "generate_uat_package"
        quality_gate_rules:
          coverage_threshold_source: "QA_WORKBENCH_COVERAGE_THRESHOLD"
          require_zero_critical_defects: true
          require_no_failed_suites: true
          require_evidence_links: true
          require_fixture_registry: true
        integration_actions:
          - id: "create_external_bug"
            providers: ["jira"]
            fallback_provider: "oddjob"
            source_dataset: "qa_workbench_defects"
            writes_back:
              - "externalIssueProvider"
              - "externalIssueKey"
              - "externalIssueUrl"
              - "externalIssueStatus"
              - "externalIssueCreatedAt"
            required_fields: ["title", "severity", "reproSteps", "actualResult", "suiteName"]
        mission_handoffs:
          - target_mission: "mission-3-core-dev"
            trigger_name: "Core Application Development"
            when: "blocking_defect_logged"
          - target_mission: "mission-5-uat"
            trigger_name: "Release Candidate & UAT"
            when: "qa_gate_approved"
          - target_mission: "mission-7-production-hotfix"
            trigger_name: "Production Incident & Hotfix Routing"
            when: "critical_regression_or_production_like_failure"
        cycle_manager:
          launch_contexts: ["mission-3-core-dev", "mission-4-qa", "mission-5-uat", "mission-7-production-hotfix"]
          surface: "modal"
          app_builder_editable: true
      - id: "stakeholder-workbench"
        name: "Stakeholder Workbench"
        purpose: "Review delivery readiness, complete UAT and CAB decisions, inspect risk and value signals, and publish evidence-backed release communications."
        interaction_model: "approval-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        dependent_missions: ["mission-4-qa", "mission-5-uat", "mission-6-deployment", "mission-7-production-hotfix"]
        datasets:
          - "stakeholder_workbench_uat"
          - "stakeholder_workbench_cab"
          - "stakeholder_workbench_roi"
          - "stakeholder_workbench_release_reports"
        primary_actions:
          - "review_release_readiness"
          - "record_uat_decision"
          - "record_cab_decision"
          - "publish_release_report"
        integration_fallbacks:
          confluence: "local_export"
          jira: "oddjob_datasets"
        cycle_manager:
          launch_contexts: ["mission-4-qa", "mission-5-uat", "mission-6-deployment", "mission-7-production-hotfix"]
          surface: "modal"
          app_builder_editable: true
      - id: "ai-workforce-dashboard"
        name: "AI Workforce Dashboard"
        purpose: "Monitor hybrid-team workload, active and blocked missions, spend, autonomy guardrails, attention items, and agent intervention history."
        interaction_model: "monitoring-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        dependent_missions: ["mission-0-sprint-zero", "mission-1-kickoff", "mission-2-requirements", "mission-3-core-dev", "mission-4-qa", "mission-5-uat", "mission-6-deployment", "mission-7-production-hotfix", "mission-scouting-report"]
        data_contracts:
          - endpoint: "/fleet/workload"
            refresh_seconds: 30
            required_fields: ["cycle", "agents", "attention", "summary", "generatedAt"]
        primary_actions:
          - "review_attention_queue"
          - "inspect_agent_flight_recorder"
          - "review_budget_pressure"
          - "manage_autonomy_guardrails"
          - "trigger_agent_improvement_plan"
        degraded_behavior: "Display last-known update time and an unavailable state; never represent missing workload as an empty healthy fleet."
        cycle_manager:
          launch_contexts: ["mission-3-core-dev", "mission-4-qa", "mission-6-deployment", "mission-7-production-hotfix", "mission-scouting-report"]
          surface: "modal"
          app_builder_editable: true
      - id: "ops-workbench"
        name: "Operations Workbench"
        purpose: "Declare, triage, and drive production incidents to resolution against the shared incidents collection."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "incidents"
        primary_actions:
          - "declare_incident"
          - "advance_incident_status"
      - id: "sales-workbench"
        name: "Sales Workbench"
        purpose: "Manage the opportunity pipeline from first touch through close against persisted records."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "sales_workbench_opportunities"
        primary_actions:
          - "create_opportunity"
          - "advance_opportunity_stage"
      - id: "marketing-workbench"
        name: "Marketing Workbench"
        purpose: "Plan, launch, and pause campaigns across channels against persisted records."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "marketing_workbench_campaigns"
        primary_actions:
          - "create_campaign"
          - "advance_campaign_status"
      - id: "customer-success-workbench"
        name: "Customer Success Workbench"
        purpose: "Track account health scores, renewals, and lifecycle state against persisted records."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "cs_workbench_accounts"
        primary_actions:
          - "register_account"
          - "advance_account_status"
      - id: "finance-workbench"
        name: "Finance Workbench"
        purpose: "Track invoices and payables from draft through approval to payment against persisted records."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "finance_workbench_invoices"
        primary_actions:
          - "create_invoice"
          - "advance_invoice_status"
      - id: "hr-workbench"
        name: "HR Workbench"
        purpose: "Track people records from onboarding through active employment to offboarding."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "hr_workbench_employees"
        primary_actions:
          - "register_employee"
          - "advance_employee_status"
      - id: "legal-workbench"
        name: "Legal Workbench"
        purpose: "Track contracts from draft through signature to expiry against persisted records."
        interaction_model: "records-workbench"
        embed_mode: "cycle-modal"
        external_mode: "secure-page"
        datasets:
          - "legal_workbench_contracts"
        primary_actions:
          - "create_contract"
          - "advance_contract_status"
    environment_variables:
      PM_WORKBENCH_NOTIFICATION_CHANNEL: "${ENV.PM_WORKBENCH_NOTIFICATION_CHANNEL}"
      PM_WORKBENCH_REQUIREMENT_QUALITY_THRESHOLD: "${ENV.PM_WORKBENCH_REQUIREMENT_QUALITY_THRESHOLD}"
      PM_WORKBENCH_VELOCITY_PREDICTION_WINDOW_DAYS: "${ENV.PM_WORKBENCH_VELOCITY_PREDICTION_WINDOW_DAYS}"
      SCRUM_MASTER_WORKBENCH_SPRINT_LENGTH_DAYS: "${ENV.SCRUM_MASTER_WORKBENCH_SPRINT_LENGTH_DAYS}"
      SCRUM_MASTER_WORKBENCH_VELOCITY_ANOMALY_THRESHOLD: "${ENV.SCRUM_MASTER_WORKBENCH_VELOCITY_ANOMALY_THRESHOLD}"
      SCRUM_MASTER_WORKBENCH_BLOCKER_SLA_HOURS: "${ENV.SCRUM_MASTER_WORKBENCH_BLOCKER_SLA_HOURS}"
      QA_WORKBENCH_COVERAGE_THRESHOLD: "${ENV.QA_WORKBENCH_COVERAGE_THRESHOLD}"
      QA_WORKBENCH_FLAKY_TEST_THRESHOLD: "${ENV.QA_WORKBENCH_FLAKY_TEST_THRESHOLD}"
      QA_WORKBENCH_CRITICAL_PATH_COVERAGE: "${ENV.QA_WORKBENCH_CRITICAL_PATH_COVERAGE}"
      STAKEHOLDER_WORKBENCH_DIGEST_FREQUENCY_HOURS: "${ENV.STAKEHOLDER_WORKBENCH_DIGEST_FREQUENCY_HOURS}"
      STAKEHOLDER_WORKBENCH_ROI_CALCULATION_WINDOW_DAYS: "${ENV.STAKEHOLDER_WORKBENCH_ROI_CALCULATION_WINDOW_DAYS}"
      STAKEHOLDER_WORKBENCH_APPROVAL_SLA_HOURS: "${ENV.STAKEHOLDER_WORKBENCH_APPROVAL_SLA_HOURS}"
      AI_WORKFORCE_DASHBOARD_SUCCESS_RATE_THRESHOLD: "${ENV.AI_WORKFORCE_DASHBOARD_SUCCESS_RATE_THRESHOLD}"
      AI_WORKFORCE_DASHBOARD_TOKEN_BUDGET_ALERT_PERCENT: "${ENV.AI_WORKFORCE_DASHBOARD_TOKEN_BUDGET_ALERT_PERCENT}"
      AI_WORKFORCE_DASHBOARD_PIP_IMPROVEMENT_WINDOW_DAYS: "${ENV.AI_WORKFORCE_DASHBOARD_PIP_IMPROVEMENT_WINDOW_DAYS}"
    customizations:
      ui:
        theme: "professional"
        layout: "dashboard"
        default_view: "home"
        sidebar_collapsed: false
      workflow:
        approval_steps: ["product_owner", "technical_lead"]
        auto_assign_reviewers: true
        require_test_coverage: true
      integrations:
        jira:
          auto_sync: true
          sync_interval_minutes: 30
          sprint_management: true
          auto_create_bugs: true
          agent_performance_linking: true
        slack:
          notify_on_changes: true
          notification_channel: "#product-updates"
          standup_bot_enabled: true
          blocker_alerts_enabled: true
          executive_alerts: true
          digest_notifications: true
          pip_notifications: true
          budget_alerts: true
        github:
          pr_test_results: true
          coverage_badges: true
        email:
          report_scheduling: true
          digest_enabled: true
        playwright:
          e2e_test_execution: true

# Organization-level customizations
org_customizations:
  ui:
    default_theme: "professional"
    enable_dark_mode: true
    timezone: "UTC"
  workflow:
    default_approval_timeout_hours: 24
    enable_parallel_approvals: true
    require_change_request_for_critical: true
  security:
    enable_audit_logging: true
    session_timeout_minutes: 60
    require_mfa_for_critical_actions: true
  notifications:
    default_channel: "slack"
    digest_enabled: true
    digest_interval_hours: 4
    quiet_hours_enabled: true
    quiet_hours_start: "18:00"
    quiet_hours_end: "09:00"

# Multi-Agent Ceremony & Deliberation Rooms
ceremonies:
  - stage_id: "sprint-kickoff"
    title: "Sprint Kickoff & Planning Ceremony"
    topic: "Sprint Goal Definition, Capacity Planning, and Epics Triage"
    mode: "decide"
    is_standing_room: true
    roster_agents:
      - "ai-scrum-master"
      - "ai-systems-analyst"
      - "ai-backend-dev"
    required_decisions:
      - "Approve Sprint Scope & Commitments"
      - "Verify Capacity and Tool Token Budgets"
    auto_convene: true

  - stage_id: "architecture-review"
    title: "Architecture & RFC Review Council"
    topic: "Review API specifications, Drizzle database schema, and distributed tracing contracts"
    mode: "decide"
    is_standing_room: false
    roster_agents:
      - "ai-systems-analyst"
      - "ai-backend-dev"
      - "ai-qa-engineer"
    required_decisions:
      - "Approve Schema Migration & API Route Specs"
      - "Validate Tenant Isolation Boundaries"
    auto_convene: true

  - stage_id: "release-candidate-uat"
    title: "Release Candidate Sign-off & Go/No-Go"
    topic: "UAT validation, security scan verification, and staging regression review"
    mode: "review"
    is_standing_room: false
    roster_agents:
      - "ai-release-manager"
      - "ai-qa-engineer"
      - "ai-scrum-master"
    required_decisions:
      - "Sign-off on Staging Regression Suite"
      - "Authorize Production Deployment Window"
    auto_convene: true

  - stage_id: "production-incident"
    title: "Production Incident War Room & Post-Mortem"
    topic: "Live triage, hotfix verification, and Root Cause Analysis (RCA)"
    mode: "execute"
    is_standing_room: false
    roster_agents:
      - "ai-scrum-master"
      - "ai-backend-dev"
      - "ai-release-manager"
    required_decisions:
      - "Approve Production Hotfix"
      - "Publish Incident RCA Document"
    auto_convene: true

name: "Bug Triage & Classification"
version: "1.0"
containers: {}
description: "Automated bug classification, prioritization, and assignment using JQL injection for pattern matching. Leverages historical bug data to categorize and route bugs to appropriate teams."
author: "Oddjob Marketplace"

ui_metadata:
  display_name: "Bug Triage & Classification"
  icon: "🐛"
  theme_color: "#ef4444"
  display_priority: 1
  category: "development"
  show_in_gallery: true
  featured: true

guardrails:
  execution_sandbox: true
  max_thrashing_iterations: 3
  enforce_read_only_prod: true
  token_budget_per_ticket: 200000

ai_provider:
  provider: "anthropic"
  api_key: "${ENV.AI_API_KEY}"
  default_model: "claude-3.5-sonnet"
  fallback_model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 4096
  timeout_ms: 120000

tech_stack:
  backend_language: "${ENV.TECH_BACKEND_LANG}"
  frontend_framework: "${ENV.TECH_FRONTEND_FRAMEWORK}"

portfolio_classification:
  group_type: "operations"
  capitalization_category: "OpEx"
  cost_center: "${ENV.ENTERPRISE_COST_CENTER}"

organizational_guidelines:
  coding_standards:
    required: true
    path: "file://knowledge/guidelines/coding_standards.md"

integrations:
  source_control:
    required: false
    provider: "${ENV.GIT_PROVIDER}"
    repo_url: "${ENV.GIT_REPO_URL}"
    api_token: "${ENV.GIT_API_TOKEN}"
  database:
    required: false
    dialect: "${ENV.DB_DIALECT}"
    dev_url: "${ENV.DEV_DATABASE_URL}"
  jira:
    required: true
    project_key: "${ENV.JIRA_PROJECT_KEY}"
    endpoint: "${ENV.JIRA_BASE_URL}"
    api_token: "${ENV.JIRA_API_TOKEN}"
  confluence:
    required: true
    engineering_space: "${ENV.CONFLUENCE_ENG_SPACE}"
    endpoint: "${ENV.CONFLUENCE_BASE_URL}"
    api_token: "${ENV.CONFLUENCE_API_TOKEN}"
  slack:
    required: true
    workspace_id: "${ENV.SLACK_WORKSPACE_ID}"
    alerts_channel: "${ENV.SLACK_ALERTS_CHANNEL}"

templates:
  - id: "bug_report_template"
    path: "file://knowledge/document-templates/bug_report_template.md"
  - id: "triage_report_template"
    path: "file://knowledge/document-templates/triage_report_template.md"

forms:
  - id: "bug_intake"
    name: "Bug Report Intake"
    description: "Provide bug details for automated triage."
    fields:
      - name: "bug_summary"
        label: "Bug Summary"
        type: "text"
        required: true
      - name: "description"
        label: "Detailed Description"
        type: "textarea"
        required: true
      - name: "reproduction_steps"
        label: "Reproduction Steps"
        type: "textarea"
        required: true
      - name: "environment"
        label: "Environment"
        type: "select"
        required: true
        options: ["Production", "Staging", "Development"]
      - name: "browser_or_device"
        label: "Browser/Device"
        type: "text"
        required: false
      - name: "error_logs"
        label: "Error Logs"
        type: "textarea"
        required: false
      - name: "severity_suggestion"
        label: "Suggested Severity"
        type: "select"
        required: false
        options: ["P1 - Critical", "P2 - High", "P3 - Medium", "P4 - Low"]

  - id: "triage_review"
    name: "Bug Triage Review"
    description: "Review and approve the automated triage classification."
    fields:
      - name: "classification_approved"
        label: "Approve Classification"
        type: "select"
        required: true
        options: ["Approve & Create JIRA Bug", "Adjust Classification", "Reject"]
      - name: "adjusted_severity"
        label: "Adjusted Severity"
        type: "select"
        required: false
        options: ["P1 - Critical", "P2 - High", "P3 - Medium", "P4 - Low"]
      - name: "adjusted_assignee"
        label: "Adjusted Assignee"
        type: "text"
        required: false
      - name: "comments"
        label: "Comments"
        type: "textarea"
        required: false

agents:
  - id: "ai-qa-engineer"
    name: "End-to-End Test Suite Auditor"
    role: "worker"
    model: "claude-3.5-sonnet"
    temperature: 0.0
    max_iterations: 3
    token_budget: 150000
    soul_profile:
      archetype: "The Relentless Auditor"
      legend: "Classifies bugs by severity and patterns using historical data."
      traits: { compliance: 95, creativity: 10, persistence: 90 }
    system_prompt: "file://knowledge/prompts/qa-engineer.md"
    boundaries: ["tests/e2e/", "tests/integration/", "server/", "client/"]
    permissions: ["github:read", "jira:write:bug", "slack:write:channel"]
    tools: ["jira_jql_search", "jira_create_bug", "knowledge_graph_query", "confluence_read", "confluence_publish"]

  - id: "ai-systems-analyst"
    name: "Product Requirement Systems Analyst"
    role: "supervisor"
    model: "claude-3.5-sonnet"
    temperature: 0.1
    max_iterations: 3
    token_budget: 100000
    soul_profile:
      archetype: "The Precision Architect"
      legend: "Analyzes bug patterns and recommends assignees."
      traits: { compliance: 90, creativity: 20, speed: 60 }
    system_prompt: "file://knowledge/prompts/systems-analyst.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["confluence:read", "jira:read"]
    tools: ["knowledge_graph_query", "jira_jql_search"]

missions:
  - id: "mission-analyze-bug"
    name: "Analyze Bug Report"
    objective: "Parse bug report and query historical patterns"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger:
      type: "manual"
      source: "qa_workbench"
    primary_agent: "ai-qa-engineer"
    inputs: ["bug_intake"]
    outputs: ["bug_analysis"]
    config:
      jiraJqlQuery: "project = ${ENV.JIRA_PROJECT_KEY} AND type = Bug AND status = Done ORDER BY updated DESC"
    sequence:
      - step_code: "BUG-1"
        action: "parse_bug_report"
        description: "Parse bug report into structured format"
        estimated_duration_minutes: 10
        template: "bug_report_template"
      - step_code: "BUG-2"
        action: "query_historical_bugs"
        description: "Query JQL for similar historical bugs"
        estimated_duration_minutes: 5
        tool: "jira_jql_search"
      - step_code: "BUG-3"
        action: "analyze_patterns"
        description: "Analyze patterns from historical bugs"
        estimated_duration_minutes: 15
        tool: "knowledge_graph_query"
      - step_code: "BUG-4"
        action: "classify_severity"
        description: "Classify bug severity based on patterns"
        estimated_duration_minutes: 10

  - id: "mission-classify-bug"
    name: "Classify and Assign Bug"
    objective: "Determine severity, category, and assignee"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-analyze-bug)"
    primary_agent: "ai-systems-analyst"
    inputs: ["bug_analysis"]
    outputs: ["bug_classification"]
    sequence:
      - step_code: "CLASS-1"
        action: "determine_severity"
        description: "Determine bug severity (P1-P4)"
        estimated_duration_minutes: 10
      - step_code: "CLASS-2"
        action: "categorize_bug"
        description: "Categorize bug by type (UI, Backend, Database, Integration)"
        estimated_duration_minutes: 10
      - step_code: "CLASS-3"
        action: "recommend_assignee"
        description: "Recommend assignee based on category and expertise"
        estimated_duration_minutes: 15
      - step_code: "CLASS-4"
        action: "generate_triage_report"
        description: "Generate triage report with recommendations"
        estimated_duration_minutes: 15
        template: "triage_report_template"

  - id: "mission-review-triage"
    name: "Review Triage Classification"
    objective: "Human review and approval of bug classification"
    type: "milestone"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-classify-bug)"
    primary_agent: "ai-qa-engineer"
    inputs: ["bug_classification"]
    outputs: ["approved_classification"]
    requires_human: true
    form_ref: "triage_review"
    pause_at_milestone: true
    sequence:
      - step_code: "REVIEW-1"
        action: "present_classification"
        description: "Present bug classification for review"
        estimated_duration_minutes: 10
      - step_code: "REVIEW-2"
        action: "collect_approval"
        description: "Collect human approval and adjustments"
        estimated_duration_minutes: 30
        requires_human: true
      - step_code: "REVIEW-3"
        action: "finalize_classification"
        description: "Finalize classification based on feedback"
        estimated_duration_minutes: 20

  - id: "mission-create-jira-bug"
    name: "Create JIRA Bug"
    objective: "Create bug in JIRA with classification details"
    type: "mission"
    environment: "production"
    estimated_duration_hours: 0.5
    trigger: "on_success(mission-review-triage)"
    primary_agent: "ai-qa-engineer"
    inputs: ["approved_classification"]
    outputs: ["jira_bug"]
    sequence:
      - step_code: "CREATE-1"
        action: "create_bug"
        description: "Create bug in JIRA with classification"
        estimated_duration_minutes: 10
        tool: "jira_create_bug"
      - step_code: "CREATE-2"
        action: "publish_triage_report"
        description: "Publish triage report to Confluence"
        estimated_duration_minutes: 5
        tool: "confluence_publish"
      - step_code: "CREATE-3"
        action: "notify_assignee"
        description: "Notify assignee via Slack"
        estimated_duration_minutes: 5
        tool: "slack_post_message"

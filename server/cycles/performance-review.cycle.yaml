name: "Performance Review"
version: "1.0"
containers: {}
description: "Automated 360-degree feedback collection, performance assessment, and development planning. Integrates with HRIS for employee data, JIRA for review tasks, and Confluence for documentation."
author: "Oddjob Marketplace"

ui_metadata:
  display_name: "Performance Review"
  icon: "📊"
  theme_color: "#8b5cf6"
  display_priority: 2
  category: "hr"
  show_in_gallery: true
  featured: false

guardrails:
  execution_sandbox: true
  max_thrashing_iterations: 3
  enforce_read_only_prod: false
  token_budget_per_ticket: 250000

ai_provider:
  provider: "anthropic"
  api_key: "${ENV.AI_API_KEY}"
  default_model: "claude-3.5-sonnet"
  fallback_model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 4096
  timeout_ms: 120000

tech_stack:
  backend_language: "${ENV.TECH_BACKEND_LANG}"
  frontend_framework: "${ENV.TECH_FRONTEND_FRAMEWORK}"

portfolio_classification:
  group_type: "hr"
  capitalization_category: "OpEx"
  cost_center: "${ENV.ENTERPRISE_COST_CENTER}"

organizational_guidelines:
  coding_standards:
    required: true
    path: "file://knowledge/guidelines/coding_standards.md"
  hr_policies:
    required: true
    path: "file://knowledge/guidelines/hr_policies.md"

integrations:
  source_control:
    required: false
    provider: "${ENV.GIT_PROVIDER}"
    repo_url: "${ENV.GIT_REPO_URL}"
    api_token: "${ENV.GIT_API_TOKEN}"
  database:
    required: true
    dialect: "${ENV.DB_DIALECT}"
    dev_url: "${ENV.DEV_DATABASE_URL}"
  jira:
    required: true
    project_key: "${ENV.JIRA_PROJECT_KEY}"
    endpoint: "${ENV.JIRA_BASE_URL}"
    api_token: "${ENV.JIRA_API_TOKEN}"
  confluence:
    required: true
    engineering_space: "${ENV.CONFLUENCE_ENG_SPACE}"
    endpoint: "${ENV.CONFLUENCE_BASE_URL}"
    api_token: "${ENV.CONFLUENCE_API_TOKEN}"
  slack:
    required: true
    workspace_id: "${ENV.SLACK_WORKSPACE_ID}"
    approvals_channel: "${ENV.SLACK_APPROVALS_CHANNEL}"

templates:
  - id: "performance_review_template"
    path: "file://knowledge/document-templates/performance_review_template.md"
  - id: "development_plan_template"
    path: "file://knowledge/document-templates/development_plan_template.md"

forms:
  - id: "review_intake"
    name: "Performance Review Intake"
    description: "Provide review period and employee details."
    fields:
      - name: "employee_name"
        label: "Employee Name"
        type: "text"
        required: true
      - name: "review_period"
        label: "Review Period"
        type: "select"
        required: true
        options: ["Q1 2026", "Q2 2026", "Q3 2026", "Q4 2026", "Annual 2026"]
      - name: "review_type"
        label: "Review Type"
        type: "select"
        required: true
        options: ["360-Degree Review", "Manager Review", "Self-Review", "Peer Review"]
      - name: "department"
        label: "Department"
        type: "select"
        required: true
        options: ["Engineering", "Sales", "Marketing", "Finance", "HR", "Operations"]
      - name: "manager"
        label: "Manager"
        type: "text"
        required: true
      - name: "peers"
        label: "Peer Reviewers"
        type: "textarea"
        required: false

  - id: "review_approval"
    name: "Performance Review Approval"
    description: "Review and approve performance assessment."
    fields:
      - name: "approval_status"
        label: "Approval Status"
        type: "select"
        required: true
        options: ["Approve & Finalize", "Request Revisions", "Reject"]
      - name: "rating_agreement"
        label: "Rating Agreement"
        type: "select"
        required: true
        options: ["Yes - Agree with Rating", "Yes - Minor Adjustment", "No - Significant Adjustment Needed"]
      - name: "development_plan_approved"
        label: "Development Plan Approved"
        type: "select"
        required: true
        options: ["Yes - Approved", "Yes - With Modifications", "No - Not Approved"]
      - name: "comments"
        label: "Comments"
        type: "textarea"
        required: false

agents:
  - id: "ai-hr-manager"
    name: "HR Policy & Operations Manager"
    role: "worker"
    model: "claude-3.5-sonnet"
    temperature: 0.0
    max_iterations: 3
    token_budget: 150000
    soul_profile:
      archetype: "The People Strategist"
      legend: "Manages performance reviews and development planning."
      traits: { compliance: 95, creativity: 10, speed: 60 }
    system_prompt: "file://knowledge/prompts/hr-manager.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["jira:read", "jira:write", "slack:write:channel", "confluence:read", "confluence:write"]
    tools: ["knowledge_graph_query", "jira_jql_search", "jira_create_sprint", "confluence_publish", "slack_post_message"]

  - id: "ai-hr-analyst"
    name: "Human Resources Data Analyst"
    role: "supervisor"
    model: "claude-3.5-sonnet"
    temperature: 0.0
    max_iterations: 3
    token_budget: 100000
    soul_profile:
      archetype: "The Data-Driven People Expert"
      legend: "Analyzes performance data and provides insights."
      traits: { compliance: 90, creativity: 15, speed: 70 }
    system_prompt: "file://knowledge/prompts/hr-analyst.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["jira:read", "confluence:read"]
    tools: ["knowledge_graph_query", "jira_jql_search"]

missions:
  - id: "mission-initiate-review"
    name: "Initiate Performance Review"
    objective: "Initialize performance review process"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger:
      type: "manual"
      source: "hr_workbench"
    primary_agent: "ai-hr-manager"
    inputs: ["review_intake"]
    outputs: ["review_initiation"]
    sequence:
      - step_code: "INIT-1"
        action: "query_employee_data"
        description: "Query employee performance data"
        estimated_duration_minutes: 15
        tool: "knowledge_graph_query"
      - step_code: "INIT-2"
        action: "select_reviewers"
        description: "Select appropriate reviewers"
        estimated_duration_minutes: 15
      - step_code: "INIT-3"
        action: "create_review_tasks"
        description: "Create JIRA tasks for reviewers"
        estimated_duration_minutes: 20
        tool: "jira_create_sprint"
      - step_code: "INIT-4"
        action: "set_deadlines"
        description: "Set review deadlines"
        estimated_duration_minutes: 10

  - id: "mission-collect-feedback"
    name: "Collect 360-Degree Feedback"
    objective: "Collect feedback from multiple sources"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 2
    trigger: "on_success(mission-initiate-review)"
    primary_agent: "ai-hr-manager"
    inputs: ["review_initiation"]
    outputs: ["collected_feedback"]
    sequence:
      - step_code: "FEEDBACK-1"
        action: "send_self_review"
        description: "Send self-review request to employee"
        estimated_duration_minutes: 10
      - step_code: "FEEDBACK-2"
        action: "send_manager_review"
        description: "Send manager review request"
        estimated_duration_minutes: 10
      - step_code: "FEEDBACK-3"
        action: "send_peer_reviews"
        description: "Send peer review requests"
        estimated_duration_minutes: 15
      - step_code: "FEEDBACK-4"
        action: "collect_responses"
        description: "Collect all review responses"
        estimated_duration_minutes: 45
      - step_code: "FEEDBACK-5"
        action: "aggregate_feedback"
        description: "Aggregate and summarize feedback"
        estimated_duration_minutes: 20

  - id: "mission-analyze-performance"
    name: "Analyze Performance"
    objective: "Analyze performance data and feedback"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-collect-feedback)"
    primary_agent: "ai-hr-analyst"
    inputs: ["collected_feedback"]
    outputs: ["performance_analysis"]
    sequence:
      - step_code: "ANALYZE-1"
        action: "analyze_strengths"
        description: "Identify employee strengths"
        estimated_duration_minutes: 15
      - step_code: "ANALYZE-2"
        action: "identify_improvements"
        description: "Identify areas for improvement"
        estimated_duration_minutes: 15
      - step_code: "ANALYZE-3"
        action: "calculate_rating"
        description: "Calculate performance rating"
        estimated_duration_minutes: 15
      - step_code: "ANALYZE-4"
        action: "compare_peers"
        description: "Compare with peer performance"
        estimated_duration_minutes: 10
      - step_code: "ANALYZE-5"
        action: "generate_insights"
        description: "Generate performance insights"
        estimated_duration_minutes: 5

  - id: "mission-generate-review"
    name: "Generate Performance Review"
    objective: "Generate comprehensive performance review document"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-analyze-performance)"
    primary_agent: "ai-hr-manager"
    inputs: ["performance_analysis"]
    outputs: ["performance_review"]
    sequence:
      - step_code: "GEN-1"
        action: "compile_feedback"
        description: "Compile feedback from all sources"
        estimated_duration_minutes: 15
      - step_code: "GEN-2"
        action: "write_assessment"
        description: "Write performance assessment"
        estimated_duration_minutes: 20
      - step_code: "GEN-3"
        action: "assign_rating"
        description: "Assign performance rating"
        estimated_duration_minutes: 10
      - step_code: "GEN-4"
        action: "generate_review_document"
        description: "Generate performance review document"
        estimated_duration_minutes: 15
        template: "performance_review_template"

  - id: "mission-create-development-plan"
    name: "Create Development Plan"
    objective: "Generate development plan based on review"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-generate-review)"
    primary_agent: "ai-hr-manager"
    inputs: ["performance_review"]
    outputs: ["development_plan"]
    sequence:
      - step_code: "DEV-1"
        action: "identify_goals"
        description: "Identify development goals"
        estimated_duration_minutes: 15
      - step_code: "DEV-2"
        action: "define_actions"
        description: "Define action items"
        estimated_duration_minutes: 15
      - step_code: "DEV-3"
        action: "set_timeline"
        description: "Set timeline for goals"
        estimated_duration_minutes: 10
      - step_code: "DEV-4"
        action: "assign_resources"
        description: "Assign training and resources"
        estimated_duration_minutes: 10
      - step_code: "DEV-5"
        action: "generate_plan_document"
        description: "Generate development plan document"
        estimated_duration_minutes: 10
        template: "development_plan_template"

  - id: "mission-review-approval"
    name: "Review and Approval"
    objective: "Human review and approval of performance review"
    type: "milestone"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-create-development-plan)"
    primary_agent: "ai-hr-manager"
    inputs: ["performance_review", "development_plan"]
    outputs: ["approved_review"]
    requires_human: true
    form_ref: "review_approval"
    pause_at_milestone: true
    sequence:
      - step_code: "APPROVE-1"
        action: "present_review"
        description: "Present performance review for approval"
        estimated_duration_minutes: 10
      - step_code: "APPROVE-2"
        action: "collect_approval"
        description: "Collect HR director and manager approval"
        estimated_duration_minutes: 30
        requires_human: true
      - step_code: "APPROVE-3"
        action: "finalize_review"
        description: "Finalize review based on feedback"
        estimated_duration_minutes: 20

  - id: "mission-finalize-review"
    name: "Finalize Performance Review"
    objective: "Finalize and distribute performance review"
    type: "mission"
    environment: "production"
    estimated_duration_hours: 0.5
    trigger: "on_success(mission-review-approval)"
    primary_agent: "ai-hr-manager"
    inputs: ["approved_review"]
    outputs: ["finalized_review"]
    sequence:
      - step_code: "FINAL-1"
        action: "publish_to_confluence"
        description: "Publish review to Confluence"
        estimated_duration_minutes: 10
        tool: "confluence_publish"
      - step_code: "FINAL-2"
        action: "schedule_meeting"
        description: "Schedule review meeting with employee"
        estimated_duration_minutes: 10
      - step_code: "FINAL-3"
        action: "notify_employee"
        description: "Notify employee via Slack"
        estimated_duration_minutes: 5
        tool: "slack_post_message"

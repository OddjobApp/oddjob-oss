name: "Employee Onboarding"
version: "1.0"
containers: {}
description: "Automated employee onboarding workflows with equipment provisioning, training assignment, and compliance documentation. Integrates with HRIS, JIRA for task tracking, and Confluence for documentation."
author: "Oddjob Marketplace"

ui_metadata:
  display_name: "Employee Onboarding"
  icon: "👋"
  theme_color: "#3b82f6"
  display_priority: 2
  category: "hr"
  show_in_gallery: true
  featured: false

guardrails:
  execution_sandbox: true
  max_thrashing_iterations: 3
  enforce_read_only_prod: false
  token_budget_per_ticket: 250000

ai_provider:
  provider: "anthropic"
  api_key: "${ENV.AI_API_KEY}"
  default_model: "claude-3.5-sonnet"
  fallback_model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 4096
  timeout_ms: 120000

tech_stack:
  backend_language: "${ENV.TECH_BACKEND_LANG}"
  frontend_framework: "${ENV.TECH_FRONTEND_FRAMEWORK}"

portfolio_classification:
  group_type: "hr"
  capitalization_category: "OpEx"
  cost_center: "${ENV.ENTERPRISE_COST_CENTER}"

organizational_guidelines:
  coding_standards:
    required: true
    path: "file://knowledge/guidelines/coding_standards.md"
  hr_policies:
    required: true
    path: "file://knowledge/guidelines/hr_policies.md"

integrations:
  source_control:
    required: false
    provider: "${ENV.GIT_PROVIDER}"
    repo_url: "${ENV.GIT_REPO_URL}"
    api_token: "${ENV.GIT_API_TOKEN}"
  database:
    required: true
    dialect: "${ENV.DB_DIALECT}"
    dev_url: "${ENV.DEV_DATABASE_URL}"
  jira:
    required: true
    project_key: "${ENV.JIRA_PROJECT_KEY}"
    endpoint: "${ENV.JIRA_BASE_URL}"
    api_token: "${ENV.JIRA_API_TOKEN}"
  confluence:
    required: true
    engineering_space: "${ENV.CONFLUENCE_ENG_SPACE}"
    endpoint: "${ENV.CONFLUENCE_BASE_URL}"
    api_token: "${ENV.CONFLUENCE_API_TOKEN}"
  slack:
    required: true
    workspace_id: "${ENV.SLACK_WORKSPACE_ID}"
    approvals_channel: "${ENV.SLACK_APPROVALS_CHANNEL}"

templates:
  - id: "onboarding_checklist"
    path: "file://knowledge/document-templates/onboarding_checklist.md"
  - id: "training_plan_template"
    path: "file://knowledge/document-templates/training_plan_template.md"

forms:
  - id: "employee_intake"
    name: "Employee Intake"
    description: "Provide new employee details for onboarding."
    fields:
      - name: "employee_name"
        label: "Employee Name"
        type: "text"
        required: true
      - name: "email"
        label: "Email"
        type: "text"
        required: true
      - name: "role"
        label: "Role"
        type: "text"
        required: true
      - name: "department"
        label: "Department"
        type: "select"
        required: true
        options: ["Engineering", "Sales", "Marketing", "Finance", "HR", "Operations"]
      - name: "start_date"
        label: "Start Date"
        type: "date"
        required: true
      - name: "manager"
        label: "Manager"
        type: "text"
        required: true
      - name: "equipment_needs"
        label: "Equipment Needs"
        type: "multiselect"
        required: true
        options: ["Laptop", "Monitor", "Phone", "Peripherals", "Software Licenses"]
      - name: "special_requirements"
        label: "Special Requirements"
        type: "textarea"
        required: false

  - id: "onboarding_review"
    name: "Onboarding Review"
    description: "Review and approve onboarding progress."
    fields:
      - name: "approval_status"
        label: "Approval Status"
        type: "select"
        required: true
        options: ["Approve & Continue", "Request Revisions", "Complete Onboarding"]
      - name: "progress_update"
        label: "Progress Update"
        type: "select"
        required: true
        options: ["0-25%", "26-50%", "51-75%", "76-100%"]
      - name: "checklist_items"
        label: "Completed Checklist Items"
        type: "multiselect"
        required: true
        options: ["Equipment Provisioned", "Accounts Created", "Training Assigned", "Documentation Signed", "Team Introduction"]
      - name: "comments"
        label: "Comments"
        type: "textarea"
        required: false

agents:
  - id: "ai-hr-coordinator"
    name: "HR Operations Coordinator"
    role: "worker"
    model: "claude-3.5-sonnet"
    temperature: 0.1
    max_iterations: 3
    token_budget: 150000
    soul_profile:
      archetype: "The People Connector"
      legend: "Manages employee onboarding and HR operations."
      traits: { compliance: 90, creativity: 20, speed: 70 }
    system_prompt: "file://knowledge/prompts/hr-coordinator.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["jira:read", "jira:write", "slack:write:channel", "confluence:read", "confluence:write"]
    tools: ["knowledge_graph_query", "jira_jql_search", "jira_create_sprint", "confluence_publish", "slack_post_message"]

  - id: "ai-hr-manager"
    name: "HR Policy & Operations Manager"
    role: "supervisor"
    model: "claude-3.5-sonnet"
    temperature: 0.0
    max_iterations: 3
    token_budget: 100000
    soul_profile:
      archetype: "The People Strategist"
      legend: "Oversees onboarding processes and compliance."
      traits: { compliance: 95, creativity: 10, speed: 60 }
    system_prompt: "file://knowledge/prompts/hr-manager.md"
    boundaries: ["knowledge/", "docs/"]
    permissions: ["jira:read", "confluence:read"]
    tools: ["knowledge_graph_query", "jira_jql_search"]

missions:
  - id: "mission-create-onboarding-plan"
    name: "Create Onboarding Plan"
    objective: "Generate personalized onboarding plan"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger:
      type: "manual"
      source: "hr_workbench"
    primary_agent: "ai-hr-manager"
    inputs: ["employee_intake"]
    outputs: ["onboarding_plan"]
    sequence:
      - step_code: "PLAN-1"
        action: "analyze_role"
        description: "Analyze role and department requirements"
        estimated_duration_minutes: 15
        tool: "knowledge_graph_query"
      - step_code: "PLAN-2"
        action: "define_checklist"
        description: "Define onboarding checklist"
        estimated_duration_minutes: 15
      - step_code: "PLAN-3"
        action: "create_timeline"
        description: "Create onboarding timeline"
        estimated_duration_minutes: 15
      - step_code: "PLAN-4"
        action: "generate_plan_document"
        description: "Generate onboarding plan document"
        estimated_duration_minutes: 15
        template: "onboarding_checklist"

  - id: "mission-provision-equipment"
    name: "Provision Equipment"
    objective: "Create equipment provisioning tasks"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 0.5
    trigger: "on_success(mission-create-onboarding-plan)"
    primary_agent: "ai-hr-coordinator"
    inputs: ["onboarding_plan"]
    outputs: ["equipment_tasks"]
    sequence:
      - step_code: "EQUIP-1"
        action: "create_jira_tasks"
        description: "Create JIRA tasks for equipment provisioning"
        estimated_duration_minutes: 15
        tool: "jira_create_sprint"
      - step_code: "EQUIP-2"
        action: "assign_it_team"
        description: "Assign tasks to IT team"
        estimated_duration_minutes: 10
      - step_code: "EQUIP-3"
        action: "set_due_dates"
        description: "Set due dates before start date"
        estimated_duration_minutes: 5

  - id: "mission-setup-accounts"
    name: "Setup Accounts"
    objective: "Create account setup tasks"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 0.5
    trigger: "on_success(mission-create-onboarding-plan)"
    primary_agent: "ai-hr-coordinator"
    inputs: ["onboarding_plan"]
    outputs: ["account_tasks"]
    sequence:
      - step_code: "ACCOUNT-1"
        action: "create_jira_tasks"
        description: "Create JIRA tasks for account setup"
        estimated_duration_minutes: 15
        tool: "jira_create_sprint"
      - step_code: "ACCOUNT-2"
        action: "assign_owners"
        description: "Assign task owners"
        estimated_duration_minutes: 10
      - step_code: "ACCOUNT-3"
        action: "define_permissions"
        description: "Define access permissions"
        estimated_duration_minutes: 5

  - id: "mission-assign-training"
    name: "Assign Training"
    objective: "Generate and assign training materials"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-create-onboarding-plan)"
    primary_agent: "ai-hr-manager"
    inputs: ["onboarding_plan"]
    outputs: ["training_plan"]
    sequence:
      - step_code: "TRAIN-1"
        action: "identify_training"
        description: "Identify required training for role"
        estimated_duration_minutes: 20
      - step_code: "TRAIN-2"
        action: "generate_training_plan"
        description: "Generate training plan"
        estimated_duration_minutes: 20
        template: "training_plan_template"
      - step_code: "TRAIN-3"
        action: "create_training_tasks"
        description: "Create JIRA tasks for training"
        estimated_duration_minutes: 10
        tool: "jira_create_sprint"
      - step_code: "TRAIN-4"
        action: "publish_materials"
        description: "Publish training materials to Confluence"
        estimated_duration_minutes: 10
        tool: "confluence_publish"

  - id: "mission-track-progress"
    name: "Track Onboarding Progress"
    objective: "Monitor onboarding progress and milestones"
    type: "mission"
    environment: "planning"
    estimated_duration_hours: 0.5
    trigger:
      type: "manual"
      source: "hr_workbench"
    primary_agent: "ai-hr-coordinator"
    inputs: ["equipment_tasks", "account_tasks", "training_plan"]
    outputs: ["progress_report"]
    sequence:
      - step_code: "TRACK-1"
        action: "query_tasks"
        description: "Query JIRA for task status"
        estimated_duration_minutes: 10
        tool: "jira_jql_search"
      - step_code: "TRACK-2"
        action: "calculate_progress"
        description: "Calculate overall progress percentage"
        estimated_duration_minutes: 10
      - step_code: "TRACK-3"
        action: "identify_blockers"
        description: "Identify any blockers or delays"
        estimated_duration_minutes: 5
      - step_code: "TRACK-4"
        action: "generate_progress_report"
        description: "Generate progress report"
        estimated_duration_minutes: 5

  - id: "mission-review-onboarding"
    name: "Review Onboarding"
    objective: "Human review and approval of onboarding progress"
    type: "milestone"
    environment: "planning"
    estimated_duration_hours: 1
    trigger: "on_success(mission-track-progress)"
    primary_agent: "ai-hr-coordinator"
    inputs: ["progress_report"]
    outputs: ["approved_progress"]
    requires_human: true
    form_ref: "onboarding_review"
    pause_at_milestone: true
    sequence:
      - step_code: "REVIEW-1"
        action: "present_progress"
        description: "Present onboarding progress for review"
        estimated_duration_minutes: 10
      - step_code: "REVIEW-2"
        action: "collect_approval"
        description: "Collect HR manager approval"
        estimated_duration_minutes: 30
        requires_human: true
      - step_code: "REVIEW-3"
        action: "finalize_progress"
        description: "Finalize progress based on feedback"
        estimated_duration_minutes: 20

  - id: "mission-complete-onboarding"
    name: "Complete Onboarding"
    objective: "Complete onboarding and transition to role"
    type: "mission"
    environment: "production"
    estimated_duration_hours: 0.5
    trigger: "on_success(mission-review-onboarding)"
    primary_agent: "ai-hr-coordinator"
    inputs: ["approved_progress"]
    outputs: ["completed_onboarding"]
    sequence:
      - step_code: "COMPLETE-1"
        action: "update_status"
        description: "Update employee status to active"
        estimated_duration_minutes: 10
      - step_code: "COMPLETE-2"
        action: "schedule_checkin"
        description: "Schedule first check-in with manager"
        estimated_duration_minutes: 5
      - step_code: "COMPLETE-3"
        action: "publish_summary"
        description: "Publish onboarding summary to Confluence"
        estimated_duration_minutes: 10
        tool: "confluence_publish"
      - step_code: "COMPLETE-4"
        action: "notify_team"
        description: "Notify team via Slack"
        estimated_duration_minutes: 5
        tool: "slack_post_message"

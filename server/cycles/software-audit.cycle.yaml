name: "Oddjob Enterprise Software & Security Audit"
version: "1.0.0"
description: "Autonomous end-to-end AST security auditing, dependency CVE triage, CVSS exploitability prioritization, governed HIL remediation sign-offs, and continuous compliance posture verification."
author: "Oddjob Security Engineering"

ui_metadata:
  display_name: "Software & Security Audit"
  icon: "shield-check"
  theme_color: "#2563eb"
  display_priority: 6
  category: "security_and_compliance"
  show_in_gallery: true
  featured: true

guardrails:
  execution_sandbox: true
  max_thrashing_iterations: 3
  enforce_read_only_prod: true
  token_budget_per_ticket: 350000

ai_provider:
  provider: "google"
  api_key: "${ENV.GEMINI_API_KEY}"
  default_model: "gemini-1.5-pro-latest"
  fallback_model: "gemini-flash-latest"
  temperature: 0.1
  max_tokens: 4096
  timeout_ms: 120000

tech_stack:
  backend_language: "TypeScript"
  frontend_framework: "React"
  mobile_framework: "React Native"

portfolio_classification:
  group_type: "operations"
  capitalization_category: "OpEx"
  cost_center: "CC-SEC-01"

organizational_guidelines:
  constitution:
    required: true
    path: "knowledge/guidelines/ai_constitution.md"
  coding_standards:
    required: true
    path: "knowledge/guidelines/coding_standards.md"
  security_standards:
    required: true
    path: "knowledge/guidelines/security_standards.md"
  compliance:
    enabled: true
    frameworks: ["SOC2", "OWASP_TOP_10", "CWE", "HIPAA"]

integrations:
  source_control:
    required: true
    provider: "github"
    repo_url: "${ENV.GIT_REPO_URL}"
    api_token: "${ENV.GIT_API_TOKEN}"
  database:
    required: true
    dialect: "postgres"
    dev_url: "${ENV.DATABASE_URL}"
  jira:
    required: false
    project_key: "${ENV.JIRA_PROJECT_KEY}"
    endpoint: "${ENV.JIRA_BASE_URL}"
    api_token: "${ENV.JIRA_API_TOKEN}"
  slack:
    required: false
    workspace_id: "${ENV.SLACK_WORKSPACE_ID}"
    alerts_channel: "#security-alerts"
    approvals_channel: "#security-approvals"

observability:
  logging:
    level: "info"
    format: "json"
    structured: true
  metrics:
    enabled: true
    export_prometheus: true

directories:
  knowledge_base: "knowledge/"
  backend: ["server/", "shared/schema/"]
  frontend: ["client/", "src/"]
  testing: ["tests/"]

agents:
  - id: "security-auditor-ai"
    name: "Static Code Security Auditor"
    role: "worker"
    model: "gemini-1.5-pro-latest"
    temperature: 0.1
    system_prompt: "You are the Lead Application Security Auditor. Perform AST static analysis to identify hardcoded secrets, SQL injection, prototype pollution, command injection, and vulnerable package dependencies."
    boundaries: ["source-control", "security", "ast-analyzer"]
    permissions: ["cycle:read", "cycle:write", "mission:read", "mission:write"]
    tools:
      - "trigger_sast_scan"
      - "trigger_sca_scan"
      - "aggregate_findings"
      - "prioritize_vulnerabilities"

  - id: "secops-triage-lead"
    name: "SecOps Triage Supervisor"
    role: "supervisor"
    model: "gemini-1.5-pro-latest"
    temperature: 0.2
    system_prompt: "You are the SecOps Triage Lead. Validate vulnerability exploitability, coordinate HIL security exception sign-offs, generate surgical remediation diffs, and record compliance audit evidence."
    boundaries: ["security", "governance", "remediation"]
    permissions: ["cycle:read", "cycle:write", "mission:read", "mission:write", "hil:trigger"]
    tools:
      - "aggregate_findings"
      - "prioritize_vulnerabilities"
      - "generate_security_patch"
      - "trigger_hil_approval"
      - "knowledge_graph_query"

missions:
  - id: "phase_1_ast_and_sca_scanning"
    name: "AST Static Analysis & Dependency Vulnerability Scanning"
    description: "Executes deep AST scanning on target source code and Software Composition Analysis (SCA) across package manifests."
    trigger:
      type: "manual"
      source: "oddjob_dashboard"
    primary_agent: "security-auditor-ai"
    sequence:
      - step_code: "P1-1"
        action: "sast_scan"
        description: "Execute SAST AST Scan: Run trigger_sast_scan across target repository files to detect secret leakage, SQLi, command injection, and prototype pollution."
        agent: "security-auditor-ai"
      - step_code: "P1-2"
        action: "sca_scan"
        description: "Execute SCA Dependency Scan: Run trigger_sca_scan on package.json to identify vulnerable transitive/direct dependencies matching known CVEs."
        agent: "security-auditor-ai"

  - id: "phase_2_aggregation_and_prioritization"
    name: "Finding Aggregation & CVSS Prioritization"
    description: "Aggregates findings across all scanners, calculates the Security Posture Score, and ranks vulnerabilities by exploitability."
    trigger: "on_success(phase_1_ast_and_sca_scanning)"
    primary_agent: "secops-triage-lead"
    sequence:
      - step_code: "P2-1"
        action: "aggregate_report"
        description: "Aggregate Security Findings: Execute aggregate_findings to merge SAST and SCA findings into a unified SecurityAuditReport with posture scores."
        agent: "secops-triage-lead"
      - step_code: "P2-2"
        action: "prioritize_triage"
        description: "CVSS Severity Prioritization: Execute prioritize_vulnerabilities to group findings into Blockers, Sprint Fixes, and Backlog items."
        agent: "secops-triage-lead"

  - id: "phase_3_hil_security_gate"
    name: "Governed SecOps / CISO Sign-off Gate"
    description: "Halts pipeline progression for human approval if Critical or High severity vulnerabilities are detected."
    trigger: "on_success(phase_2_aggregation_and_prioritization)"
    primary_agent: "secops-triage-lead"
    sequence:
      - step_code: "P3-1"
        action: "secops_approval"
        description: "Security Lead & CISO Sign-off: Review detected CVEs and SAST vulnerabilities. Approve remediation plan or grant temporary compliance exceptions."
        requires_human: true
        form_ref: "secops_approval"

  - id: "phase_4_remediation_and_compliance"
    name: "Automated Patch Generation & Compliance Evidence Ledger"
    description: "Generates surgical AST code patches, creates dependency upgrade pull requests, and logs immutable audit evidence."
    trigger: "on_success(phase_3_hil_security_gate)"
    primary_agent: "secops-triage-lead"
    sequence:
      - step_code: "P4-1"
        action: "generate_patches"
        description: "Generate Surgical Security Patches: Execute generate_security_patch for each approved blocker to create surgical code diffs and dependency updates."
        agent: "secops-triage-lead"
      - step_code: "P4-2"
        action: "compliance_ledger_log"
        description: "Record SOC2 / HIPAA Audit Evidence: Record the completed security audit report and HIL attestation in the immutable compliance knowledge graph."
        agent: "secops-triage-lead"

forms:
  - id: "secops_approval"
    name: "Security Audit & Vulnerability Sign-off"
    description: "Review detected CVEs and SAST vulnerabilities. Approve remediation plan or grant temporary compliance exceptions."
    fields:
      - name: "approved"
        label: "Approve Security Remediation Plan"
        type: "boolean"
        required: true
      - name: "riskAcceptance"
        label: "Risk Acceptance Decision"
        type: "select"
        required: true
        options:
          - "Auto-Remediate Blockers (Generate PR)"
          - "Accept Risk with 30-Day Exception"
          - "Block Release & Escalate to CISO"
      - name: "mitigationNotes"
        label: "Security Officer Review & Justification Notes"
        type: "textarea"
        required: false

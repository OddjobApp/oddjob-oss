<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oddjob | Agentic Agency</title>
  <script src="/bootstrap/theme.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--boot-bg, #09090b); }
    #boot-loader {
      position: fixed; inset: 0; z-index: 9999; background: var(--boot-bg, #09090b);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    #boot-loader.hide { opacity: 0; pointer-events: none; }
    .bl-ring {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid var(--boot-ring, rgba(255,255,255,0.1));
      border-top-color: var(--boot-ring-top, rgba(255,255,255,0.6));
      animation: bl-spin 0.8s linear infinite;
    }
    @keyframes bl-spin { to { transform: rotate(360deg); } }
  </style>
  <script src="/bootstrap/loading.js"></script>
</head>
<body>
  <div id="boot-loader" aria-hidden="true"><div class="bl-ring"></div></div>
  <div id="root"></div>
  <script type="module" src="/src/entry/admin-main.tsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oddjob | Authentication</title>
  <script>
    (function(){try{var t=localStorage.getItem('oj-ui-theme')||'dark';var l=t==='light';var r=document.documentElement;r.classList.add(l?'light':'dark');var s=r.style;s.setProperty('--boot-bg',l?'#ffffff':'#09090b');s.setProperty('--boot-ring',l?'rgba(0,0,0,0.12)':'rgba(255,255,255,0.1)');s.setProperty('--boot-ring-top',l?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.6)');}catch(e){}})();
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--boot-bg, #09090b); color: white; font-family: sans-serif; }
    #root { width: 100%; height: 100%; }
    #login-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--boot-bg, #09090b); z-index: 9999; transition: opacity 0.2s ease-out; }
    .login-spinner { width: 32px; height: 32px; border: 2px solid var(--boot-ring, rgba(255,255,255,0.08)); border-top-color: var(--boot-ring-top, rgba(255,255,255,0.6)); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="login-loading">
    <div class="login-spinner"></div>
  </div>
  <div id="root"></div>
  <script>
    window.clearLoginLoading = () => {
      const el = document.getElementById('login-loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }
    };
  </script>
  <script type="module" src="/src/entry/login-main.tsx"></script>
</body>
</html>

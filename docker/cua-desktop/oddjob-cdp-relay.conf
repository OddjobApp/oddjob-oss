; Chromium binds its DevTools endpoint to 127.0.0.1:9222 inside the container, which a
; published port cannot reach. Relay it on 9223; the host publishes 9223 on loopback only.
[program:oddjob-cdp-relay]
command=/usr/bin/socat TCP-LISTEN:9223,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9222
user=cua
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/oddjob-cdp-relay.log
stderr_logfile=/var/log/supervisor/oddjob-cdp-relay.error.log

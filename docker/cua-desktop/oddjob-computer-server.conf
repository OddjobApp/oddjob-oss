[program:oddjob-computer-server]
command=/usr/local/bin/start-computer-server.sh
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1",CUA_TELEMETRY_ENABLED="false"
autorestart=true
priority=35
stdout_logfile=/var/log/supervisor/oddjob-computer-server.log
stderr_logfile=/var/log/supervisor/oddjob-computer-server.error.log
